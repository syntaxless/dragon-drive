<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Dragon Drive</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=UnifrakturCook:wght@700&display=swap">
<style>
/* Layout: one-column phone app, sticky header, fixed bottom tab bar; road-sign green accent, amber for routes, red-orange for highlights */
:root{
  --bg:#eef1f0; --surface:#ffffff; --surface-2:#e3e8e6; --line:#d2d9d6;
  --fg:#16201c; --muted:#5b6a64; --accent:#0b6e4f; --accent-fg:#ffffff;
  --route:#007aff; --hl:#e04f1a; --good:#1d8a52; --warn:#b7791f; --bad:#c2410c; --alt:#5b6fd6;
  --grid:rgba(22,32,28,.07);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --logo:"UnifrakturCook","Old English Text MT",serif;
  --tab-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#18201d; --surface-2:#212b27; --line:#2c3833;
  --fg:#e7eeeb; --muted:#94a39d; --accent:#3fbf8a; --accent-fg:#06110c;
  --route:#0a84ff; --hl:#ff7a45; --good:#4cc787; --warn:#e3a83f; --bad:#ff8a5c; --alt:#8c9cff;
  --grid:rgba(231,238,235,.07); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#18201d; --surface-2:#212b27; --line:#2c3833;
  --fg:#e7eeeb; --muted:#94a39d; --accent:#3fbf8a; --accent-fg:#06110c;
  --route:#0a84ff; --hl:#ff7a45; --good:#4cc787; --warn:#e3a83f; --bad:#ff8a5c; --alt:#8c9cff;
  --grid:rgba(231,238,235,.07); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{color:inherit;text-decoration:none;display:flex;align-items:center;gap:10px;font-family:var(--logo);font-weight:700;font-size:27px;letter-spacing:.01em;line-height:1}
.brand .logo{display:flex;flex:none}.brand .logo svg{display:block}
.unit-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.unit-toggle button{border:0;background:transparent;padding:4px 10px;font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.unit-toggle button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
main{padding-block:16px calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:30px;text-transform:uppercase}
h2{font-size:22px}
h3{font-size:18px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:currentColor;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.veh-row{display:flex;gap:12px;align-items:center;padding:8px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;font:inherit;color:inherit;cursor:pointer}
.veh-gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.veh-gallery figure{margin:0;position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2)}.veh-gallery figure.cover{grid-column:1/-1}.veh-gallery img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.veh-gallery figure.cover img{aspect-ratio:16/10}
.pic-x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px;line-height:1}
.veh-about{margin:0;white-space:pre-wrap}.garage-grid figure[role=button]{cursor:pointer}
.veh-thumb{width:64px;height:48px;border-radius:10px;border:1px dashed var(--line);background:var(--surface-2);color:var(--muted);display:grid;place-items:center;overflow:hidden;flex:none;padding:0;cursor:pointer}
.veh-thumb img{width:100%;height:100%;object-fit:cover}
.user-link{display:contents;cursor:pointer;color:inherit}.link-btn{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.notice.signup{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ptr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);left:50%;z-index:30;width:40px;height:40px;padding:4px;border-radius:50%;background:var(--surface);color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.18);transform:translate(-50%,-50px);opacity:0;pointer-events:none}
.ptr svg{width:100%;height:100%;display:block}.ptr.ready{color:var(--hl)}.ptr.spin svg{animation:wheelspin .8s linear infinite}
.garage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.garage-grid figure{margin:0;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.garage-grid img,.garage-grid .ph{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--surface-2)}
.garage-grid figcaption{padding:6px 10px;font-weight:600;font-size:14px}
.verified{margin-left:.2em;font-size:.95em;line-height:1}
.cruise-dot{width:10px;height:10px;border-radius:50%;flex:none}
.cruise-badge{background:var(--hl,#f2a93b);color:#111;font-weight:800}
.head-tags{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;flex:none;max-width:45%}
.chip.example{border:1px dashed var(--muted);background:transparent}
.chip.run{color:var(--hl)}
.chip.closed{color:var(--accent)}
input[type=text],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
label.check input{margin-top:3px;accent-color:var(--accent)}

/* feed */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card-head{display:flex;gap:10px;align-items:center;padding:14px 14px 8px}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;font-size:16px}
.card-title{padding:0 14px 8px;min-width:0}
.card-title h3{font-size:20px;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 14px 10px}
.stat{min-width:0}
.stat .k{font-size:12px;color:var(--muted);letter-spacing:.04em}
.stat .v{font-family:var(--display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 12px}
.media{display:grid;grid-template-columns:1fr;gap:2px;background:var(--line)}
.media.two{grid-template-columns:1fr 1fr}
.media.two canvas.route,.media.two .photo{aspect-ratio:1/1}
canvas.route{display:block;width:100%;aspect-ratio:16/9;max-width:100%;background:var(--surface-2)}
.photo{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--surface-2);max-width:100%}
.card-foot{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line);align-items:center}
.kudos{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:6px 8px;border-radius:8px;font-weight:600;color:var(--muted)}
.kudos[aria-pressed="true"]{color:var(--route)}
.kudos svg{width:20px;height:20px}
.open-link{border:0;background:transparent;width:100%;text-align:left;padding:0;display:block}

/* record */
.rec-panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:16px}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dash .big{grid-column:1/-1}
.gauge .k{font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gauge .v{font-family:var(--display);font-weight:700;font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.gauge.big .v{font-size:84px}
.gauge .v small{font-size:20px;color:var(--muted);font-weight:600;margin-left:4px}
.rec-btn{width:100%;border:0;border-radius:16px;padding:22px;font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-fg);position:relative;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.rec-btn.stop{background:var(--bad);color:#fff}
.rec-btn .fill{position:absolute;inset:0;background:rgba(0,0,0,.22);transform-origin:left;transform:scaleX(0)}
.rec-btn .lbl{position:relative}
.gps{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)} .dot.wait{background:var(--warn)} .dot.off{background:var(--bad)}
.notice{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:14px}
.notice strong{font-family:var(--display);letter-spacing:.04em;text-transform:uppercase;font-size:14px}
.sources{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.src{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.src b{font-family:var(--display);font-size:17px;letter-spacing:.02em}
.src span{font-size:12px;color:var(--muted)}
.src[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.src:disabled{opacity:.5}
.dev{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.drive-mode{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;justify-content:space-between;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.drive-mode .road{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1.2fr 1fr;height:var(--tab-h)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs a.rec-tab{justify-content:flex-end;gap:3px;padding-bottom:6px}
nav.tabs a.rec-tab span.ring{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;margin-top:-22px;flex:none;box-shadow:0 0 0 4px var(--surface),0 4px 14px rgba(0,0,0,.2)}
nav.tabs a.rec-tab span.ring svg{width:48px;height:48px}
nav.tabs a.rec-tab span.ring svg.spin{animation:wheelspin 1.1s cubic-bezier(.2,.7,.25,1)}
@keyframes wheelspin{from{transform:rotate(0)}to{transform:rotate(1080deg)}}
@media (prefers-reduced-motion:reduce){nav.tabs a.rec-tab span.ring svg.spin{animation:none}}
nav.tabs a.rec-tab .rec-lbl{color:var(--accent);font-size:14px}
nav.tabs a.rec-tab[aria-current="page"] span.ring{box-shadow:0 0 0 4px var(--surface),0 0 0 6px var(--accent)}
img.avatar{object-fit:cover;background:var(--surface-2);padding:0}
.profile{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.profile .avatar{width:84px;height:84px;font-size:30px}
.me-btn{display:block;border-radius:50%;text-decoration:none}
.me-btn[aria-current="page"] .avatar{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:25;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.sheet-bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.sheet .body{padding-block:16px 40px}
.detail-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
canvas.chart{display:block;width:100%;height:160px;max-width:100%}
canvas.gg{display:block;width:100%;max-width:280px;aspect-ratio:1/1;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.runs{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.runs td,.runs th{padding:8px 4px;border-top:1px solid var(--line);text-align:left}
.runs th{font-weight:500;color:var(--muted);font-size:13px}
.runs td.v{font-family:var(--display);font-weight:700;font-size:22px;text-align:right}
.runs td.v.best{color:var(--hl)}
.runs tr.attempts td{border-top:0;padding-top:0}
.runs details summary{cursor:pointer;color:var(--muted);font-size:13px;padding:2px 0}
.runs details ol{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.runs details li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 8px;border-radius:8px;color:var(--muted)}
.runs details li b{font-size:18px;color:var(--fg)}
.runs details li.is-best{background:var(--surface-2)}
.runs details li.is-best b{color:var(--hl)}
.runs td.t{color:var(--muted);text-align:right;font-size:13px;width:6.5em}
.effort{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.effort:first-of-type{border-top:0}
.comment{display:flex;gap:10px;align-items:flex-start}
.comment .avatar{width:30px;height:30px;font-size:13px}
.comment p{margin:0;overflow-wrap:anywhere}
input[type=range]{width:100%;accent-color:var(--hl)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bars .b i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bars .b span{font-size:11px;color:var(--muted)}
.map-box{position:relative;z-index:0;isolation:isolate;width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--surface-2)}
.style-pick{gap:6px}
.chip.pick{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:5px 11px;font-size:13px;cursor:pointer}
.chip.pick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip.pick input[type=color]{width:22px;height:22px;border:0;padding:0;background:none;cursor:pointer}
.cam-prev{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:12px;background:#000;margin-top:10px}.rec-dot{color:#ff453a;font-weight:700;margin-left:8px}
.share-preview{display:block;width:100%;max-width:420px;margin:0 auto;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.photo-edit{position:relative}
.photo-edit .photo{border-radius:14px;aspect-ratio:4/3}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:380px){.gauge.big .v{font-size:64px}.gauge .v{font-size:36px}.stat .v{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="wrap">
  <a class="brand" href="#feed" id="brand" aria-label="Dragon Drive, go to feed">
    <span class="logo" aria-hidden="true"><svg width="34" height="34" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#fff4d6"/><path d="M43 33q5-4 10-3q-2 2 0 3q4 1 9-1q-1 5-6 6q3 2 3 5q-6 0-9-3q-3 1-7-1z" fill="#ff8a1f" stroke="#b8400c" stroke-width="1.6" stroke-linejoin="round"/><path d="M48 34q3-1 6 0q-2 2-6 1z" fill="#ffd23f"/><path d="M9 60q-2-14 2-24q3-10 11-15q8-5 16-2q6 2 8 7q5 1 6 5q1 5-4 6q-3 1-6 0q-1 4-6 6q-5 2-10 1q-3 5-2 16z" fill="#61c24a" stroke="#1e2a1c" stroke-width="2.4" stroke-linejoin="round"/><path d="M12 36l-5-3l4-2l-5-5l6 0l-3-6l7 3" fill="none" stroke="#1e2a1c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M27 19l-3-9l6 6M35 17l2-10l2 9" fill="#61c24a" stroke="#1e2a1c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="33" cy="26" r="5" fill="#fff" stroke="#1e2a1c" stroke-width="1.8"/><circle cx="35" cy="25" r="2" fill="#1e2a1c"/><path d="M47 30l2 0" stroke="#1e2a1c" stroke-width="2" stroke-linecap="round"/><path d="M40 37q-4 2-9 1" fill="none" stroke="#1e2a1c" stroke-width="1.8" stroke-linecap="round"/><path d="M33 38l1 3l2-3" fill="#fff" stroke="#1e2a1c" stroke-width="1.2" stroke-linejoin="round"/></svg></span>
    Dragon Drive
  </a>
  <a href="#you" class="me-btn" id="me-btn" aria-label="You: profile, stats and settings"></a>
</div></header>

<main><div class="wrap" id="view"></div></main>

/* ================= geo + physics ================= */
const R=6371000,rad=d=>d*Math.PI/180,G=9.80665;
const MPH=0.44704,FT=0.3048;
function hav(a,b){const dLat=rad(b[0]-a[0]),dLon=rad(b[1]-a[1]);const x=Math.sin(dLat/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function bearing(a,b){const y=Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0]));const x=Math.cos(rad(a[0]))*Math.sin(rad(b[0]))-Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));return Math.atan2(y,x)*180/Math.PI}
function move(p,brg,dist){const la=rad(p[0]),lo=rad(p[1]),br=rad(brg),d=dist/R;const la2=Math.asin(Math.sin(la)*Math.cos(d)+Math.cos(la)*Math.sin(d)*Math.cos(br));const lo2=lo+Math.atan2(Math.sin(br)*Math.sin(d)*Math.cos(la),Math.cos(d)-Math.sin(la)*Math.sin(la2));return[la2*180/Math.PI,lo2*180/Math.PI]}
function pathLen(p){let d=0;for(let i=1;i<p.length;i++)d+=hav(p[i-1],p[i]);return d}

/* A point is [lat, lon, tMs, speed m/s, altitude m|null, gLong|null, gLat|null, gTotal|null].
   g values come from the device (RaceBox accelerometer, phone motion sensors) when present. */
const RUN_DEFS=[
  {k:"z60",label:"0–60 mph",kind:"speed",to:60*MPH},
  {k:"s60_130",label:"60–130 mph",kind:"roll",from:60*MPH,to:130*MPH},
  {k:"ft60",label:"60 ft",kind:"dist",d:60*FT},
  {k:"eighth",label:"⅛ mile",kind:"dist",d:660*FT,trap:true},
  {k:"quarter",label:"¼ mile",kind:"dist",d:1320*FT,trap:true}];
function timedRuns(pts){
  const out={};const n=pts.length;if(n<3)return out;
  // keep every attempt, and the quickest one as the headline (t, trap)
  const tStart=pts[0][2];
  const best=(k,v,t0)=>{v.at=Math.max(0,(t0-tStart)/1000);const all=out[k]?out[k].all:[];all.push(v);
    const b=all.reduce((x,y)=>y.t<x.t?y:x);out[k]={t:b.t,trap:b.trap,at:b.at,all}};
  const lerp=(a,b,f)=>a+(b-a)*f;
  // cumulative distance from integrated speed (more accurate than positions over short runs)
  const cd=[0];for(let i=1;i<n;i++)cd.push(cd[i-1]+(pts[i-1][3]+pts[i][3])/2*Math.max(0,(pts[i][2]-pts[i-1][2])/1000));
  const STILL=0.5;
  for(let i=1;i<n;i++){
    const v0=pts[i-1][3],v1=pts[i][3];
    // standing launch: speed rises through 0.5 m/s after being below it
    if(v0<=STILL&&v1>STILL){
      const f=(STILL-v0)/((v1-v0)||1);const t0=lerp(pts[i-1][2],pts[i][2],f);const d0=lerp(cd[i-1],cd[i],f);
      const need={z60:1,ft60:1,eighth:1,quarter:1};
      for(let j=i;j<n;j++){
        const a=pts[j-1],b=pts[j];if(b[3]<=STILL)break;
        if(need.z60&&a[3]<60*MPH&&b[3]>=60*MPH){const g=(60*MPH-a[3])/(b[3]-a[3]);best("z60",{t:(lerp(a[2],b[2],g)-t0)/1000},t0);need.z60=0}
        for(const r of RUN_DEFS){if(r.kind!=="dist"||!need[r.k])continue;
          if(cd[j-1]-d0<r.d&&cd[j]-d0>=r.d){const g=(r.d-(cd[j-1]-d0))/((cd[j]-cd[j-1])||1);best(r.k,{t:(lerp(a[2],b[2],g)-t0)/1000,trap:lerp(a[3],b[3],g)},t0);need[r.k]=0}}
        if(!need.z60&&!need.ft60&&!need.eighth&&!need.quarter)break;
      }
    }

    if(v0<60*MPH&&v1>=60*MPH){
      const f=(60*MPH-v0)/(v1-v0);const t0=lerp(pts[i-1][2],pts[i][2],f);
      for(let j=i+1;j<n;j++){const a=pts[j-1],b=pts[j];if(b[3]<60*MPH)break;
        if(a[3]<130*MPH&&b[3]>=130*MPH){const g=(130*MPH-a[3])/(b[3]-a[3]);best("s60_130",{t:(lerp(a[2],b[2],g)-t0)/1000},t0);break}}
    }
  }

}
function analyze(pts,full){
  let dist=0,moving=0,max=0,up=0,down=0,altMin=Infinity,altMax=-Infinity,lastAlt=null;
  let gAcc=0,gBrk=0,gLat=0,gTot=0,sensor=false;
  const n=pts.length;
  // 3-point smoothed speed for GPS-derived g when the device gives none
  const sp=pts.map((p,i)=>(pts[Math.max(0,i-1)][3]+p[3]+pts[Math.min(n-1,i+1)][3])/3);
  for(let i=0;i<n;i++){
    const p=pts[i];
    if(p[4]!=null){altMin=Math.min(altMin,p[4]);altMax=Math.max(altMax,p[4]);
      // count climbs only past 2 m so GPS altitude jitter doesn't add up
      if(lastAlt==null)lastAlt=p[4];else if(p[4]-lastAlt>2){up+=p[4]-lastAlt;lastAlt=p[4]}else if(lastAlt-p[4]>2){down+=lastAlt-p[4];lastAlt=p[4]}}
    max=Math.max(max,p[3]);
    if(p[5]!=null||p[7]!=null){sensor=true;
      if(p[5]!=null){gAcc=Math.max(gAcc,p[5]);gBrk=Math.max(gBrk,-p[5])}
      if(p[6]!=null)gLat=Math.max(gLat,Math.abs(p[6]));
      gTot=Math.max(gTot,p[7]!=null?p[7]:Math.hypot(p[5]||0,p[6]||0));}
    if(i===0)continue;

    dist+=d;if(dt>0&&d/dt>1)moving+=dt;

      let la=0;if(i>1&&p[3]>5){const h1=bearing(pts[i-2],a),h2=bearing(a,p);let dh=h2-h1;dh=((dh+540)%360)-180;la=Math.abs(rad(dh)/dt*p[3])/G}
      if(Math.abs(lo)<1.6){gAcc=Math.max(gAcc,lo);gBrk=Math.max(gBrk,-lo)}
      if(la<1.3)gLat=Math.max(gLat,la);
    }
  }
  if(!sensor)gTot=Math.max(gAcc,gBrk,gLat);

  const hz=dur>0?Math.round((n-1)/dur*10)/10:0;
  return {dist,dur,moving,avg:moving?dist/moving:0,max,up,down,altMin:isFinite(altMin)?altMin:null,altMax:isFinite(altMax)?altMax:null,
    gAcc,gBrk,gLat,gTot,gSensor:sensor,hz,runs:full===false?{}:timedRuns(pts)};
}
// Keep full-rate data for the stats, but store a lighter copy for maps and charts.
function thin(pts){
  if(pts.length<3)return pts.map(compact);
  const out=[pts[0]];
  for(let i=1;i<pts.length-1;i++){const l=out[out.length-1],p=pts[i];
    if(hav(l,p)>=8||p[2]-l[2]>=3000||(l[3]<=0.5)!==(p[3]<=0.5))out.push(p)}
  out.push(pts[pts.length-1]);return out.map(compact);
}
function compact(p){return[+p[0].toFixed(6),+p[1].toFixed(6),Math.round(p[2]),+p[3].toFixed(2),p[4]==null?null:+p[4].toFixed(1),p[5]==null?null:+p[5].toFixed(2),p[6]==null?null:+p[6].toFixed(2),p[7]==null?null:+p[7].toFixed(2)]}

/* ================= example world ================= */
function rng(seed){return()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}}
function buildRoad(){
  const r=rng(42);let p=[37.8199,-122.4783],b=200,turn=0;const out=[];
  for(let i=0;i<=520;i++){out.push([p[0],p[1],95+55*Math.sin(i/85)+18*Math.sin(i/23)]);turn+=(r()-.5)*6;turn*=.86;b+=turn;if(i>=180&&i<190)b+=7;if(i>=340&&i<350)b-=9;p=move(p,b,28)}
  return out;
}
const ROAD=buildRoad();
function driveFrom(from,to,seed,start,style){
  const r=rng(seed);const pts=[];let v=3,t=start;
  for(let i=from;i<=to;i++){
    const target=style.base+Math.sin(i/23)*style.wave+(r()-.5)*style.noise;
    v+=(target-v)*style.resp;if(r()<style.brakeP)v*=0.6;v=Math.max(2,v);
    if(i>from)t+=hav(ROAD[i-1],ROAD[i])/v*1000;
    const j=(r()-.5)*0.00004;
    pts.push([ROAD[i][0]+j,ROAD[i][1]+j,Math.round(t),v,ROAD[i][2]+(r()-.5)*3,null,null,null]);
  }
  return pts;
}
// A straight-line run at 10 Hz, like a RaceBox or Dragy logs at a drag strip or closed course.
const STRIP=[36.5865,-121.7550],STRIP_BRG=118;
function dragRun(seed,start,{a0,vtop,roll=0,target,hold=3}){
  const r=rng(seed);const pts=[];let p=STRIP.slice(),v=roll,t=start,d=0,phase=roll?"roll":"stage",clock=0;const dt=0.1;
  for(let k=0;k<1200;k++){
    let a=0;
    if(phase==="stage"){a=0;if(clock>=hold)phase="go"}
    else if(phase==="roll"){a=0;if(clock>=hold)phase="go"}
    else if(phase==="go"){a=Math.min(a0,a0*1.15*(1-(v/vtop)**2));if((target.v&&v>=target.v)||(target.d&&d>=target.d+60))phase="brake"}
    else if(phase==="brake"){a=-7.5;if(v<=0){v=0;break}}
    const gl=(r()-.5)*0.04;
    pts.push([p[0],p[1],Math.round(t),Math.max(0,v+(r()-.5)*0.05),12+(r()-.5)*0.4,+(a/G+(r()-.5)*0.02).toFixed(3),+gl.toFixed(3),null]);
    v=Math.max(0,v+a*dt);const step=v*dt;d+=step;p=move(p,STRIP_BRG,step);t+=dt*1000;clock+=dt;
  }
  return pts;
}

const NUS="6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const SOURCES={

  racebox:{name:"RaceBox",note:"Mini, Mini S or Micro over Bluetooth, up to 25 Hz",ble:{filters:[{namePrefix:"RaceBox"}],optionalServices:[NUS]}},
  dragy:{name:"Dragy",note:"Over Bluetooth, 10 Hz. Experimental",ble:{filters:[{namePrefix:"Dragy"},{namePrefix:"DRAGY"}],optionalServices:[NUS,"0000ffe0-0000-1000-8000-00805f9b34fb","0000fff0-0000-1000-8000-00805f9b34fb","00001819-0000-1000-8000-00805f9b34fb"]}},
  nmea:{name:"Other Bluetooth GPS",note:"Any receiver that streams NMEA",ble:{acceptAllDevices:true,optionalServices:[NUS,"0000ffe0-0000-1000-8000-00805f9b34fb","0000fff0-0000-1000-8000-00805f9b34fb"]}}};

// RaceBox "Data Message": UBX-framed, class 0xFF id 0x01, 80-byte payload (RaceBox BLE protocol)
function makeUbxParser(onFix){
  let buf=new Uint8Array(0);
  return chunk=>{
    const nb=new Uint8Array(buf.length+chunk.length);nb.set(buf);nb.set(chunk,buf.length);buf=nb;
    let i=0;
    while(buf.length-i>=8){
      if(buf[i]!==0xB5||buf[i+1]!==0x62){i++;continue}
      const len=buf[i+4]|(buf[i+5]<<8),total=8+len;if(buf.length-i<total)break;
      let a=0,b=0;for(let k=i+2;k<i+6+len;k++){a=(a+buf[k])&255;b=(b+a)&255}
      if(a===buf[i+6+len]&&b===buf[i+7+len]&&buf[i+2]===0xFF&&buf[i+3]===0x01&&len===80){
        const v=new DataView(buf.buffer,buf.byteOffset+i+6,80);
        const fix=v.getUint8(20),valid=v.getUint8(21)&1;
        DEV.sats=v.getUint8(23);DEV.battery=v.getUint8(67)&0x7F;
        if(fix>=2&&valid){
          const t=Date.UTC(v.getUint16(4,true),v.getUint8(6)-1,v.getUint8(7),v.getUint8(8),v.getUint8(9),v.getUint8(10))+Math.round(v.getInt32(16,true)/1e6);
          const gx=v.getInt16(68,true)/1000,gy=v.getInt16(70,true)/1000;
          onFix({lat:v.getInt32(28,true)/1e7,lon:v.getInt32(24,true)/1e7,t,v:Math.max(0,v.getInt32(48,true)/1000),alt:v.getInt32(36,true)/1000,acc:v.getUint32(40,true)/1000,gLong:gx,gLat:gy,gTot:Math.hypot(gx,gy)});
        }else onFix(null);
      }
      i+=total;
    }
    buf=buf.slice(i);
  };
}
// Standard NMEA 0183: RMC gives position/speed/time, GGA gives altitude and satellites
function makeNmeaParser(onFix){
  let text="",alt=null;const dec=new TextDecoder();
  const coord=(s,h)=>{if(!s)return NaN;const dot=s.indexOf(".");const deg=+s.slice(0,dot-2),min=+s.slice(dot-2);const v=deg+min/60;return h==="S"||h==="W"?-v:v};
  return chunk=>{
    text+=dec.decode(chunk,{stream:true});const lines=text.split(/\r?\n/);text=lines.pop();
    for(const line of lines){
      const m=line.match(/\$(..)(RMC|GGA),([^*]*)\*([0-9A-F]{2})/i);if(!m)continue;
      let cs=0;const body=line.slice(line.indexOf("$")+1,line.indexOf("*"));for(const ch of body)cs^=ch.charCodeAt(0);
      if(cs!==parseInt(m[4],16))continue;
      const f=m[3].split(",");
      if(m[2]==="GGA"){alt=f[8]?+f[8]:null;DEV.sats=+f[6]||DEV.sats;continue}
      if(f[1]!=="A"){onFix(null);continue}
      const tm=f[0],dt=f[8];
      const t=Date.UTC(2000+ +dt.slice(4,6),+dt.slice(2,4)-1,+dt.slice(0,2),+tm.slice(0,2),+tm.slice(2,4),0)+Math.round(parseFloat(tm.slice(4))*1000);
      onFix({lat:coord(f[2],f[3]),lon:coord(f[4],f[5]),t,v:(+f[6]||0)*0.514444,alt,acc:null,gLong:null,gLat:null,gTot:null});
    }
  };
}
async function connectDevice(kind){
  const src=SOURCES[kind];
  if(!hasBLE){toast("This browser can't use Bluetooth. Try Chrome on Android or a computer.");return}
  try{
    DEV.status="Choose your device…";updateDevice();
    const device=await navigator.bluetooth.requestDevice(src.ble);
    DEV.device=device;DEV.name=device.name||src.name;DEV.status="Connecting…";updateDevice();
    device.addEventListener("gattserverdisconnected",()=>{DEV.status="Disconnected";DEV.hz=0;updateDevice();if(REC.on&&S.settings.source===kind)setGps("off","Device disconnected. Recording paused until it reconnects.")});
    const server=await device.gatt.connect();
    const services=await server.getPrimaryServices();
    const onFix=fix=>{
      const now=performance.now();DEV._n++;if(now-DEV._t>1000){DEV.hz=Math.round(DEV._n*1000/(now-DEV._t));DEV._n=0;DEV._t=now}
      DEV.last=fix;DEV.status=fix?"Connected · GPS fix":"Connected · waiting for GPS fix";
      if(fix&&REC.on&&S.settings.source===kind)ingest(fix);
      throttle(updateDevice,500);
    };
    const ubx=makeUbxParser(onFix),nmea=makeNmeaParser(onFix);let subscribed=0;
    for(const s of services){let chars=[];try{chars=await s.getCharacteristics()}catch(e){}
      for(const ch of chars){if(!ch.properties.notify)continue;
        ch.addEventListener("characteristicvaluechanged",e=>{const u=new Uint8Array(e.target.value.buffer.slice(e.target.value.byteOffset,e.target.value.byteOffset+e.target.value.byteLength));if(u[0]===0xB5||kind==="racebox")ubx(u);else nmea(u)});
        try{await ch.startNotifications();subscribed++}catch(e){}}}
    DEV.status=subscribed?"Connected · waiting for data":"Connected, but the device sent nothing we can read";updateDevice();
  }catch(e){DEV.status=e&&e.name==="NotFoundError"?"No device chosen":"Couldn't connect: "+(e&&e.message||e);updateDevice()}
}
let thr={};function throttle(fn,ms){if(thr[fn.name])return;thr[fn.name]=setTimeout(()=>{thr[fn.name]=0;fn()},ms)}
function updateDevice(){const el=$("#dev-status");if(!el)return;
  el.innerHTML=DEV.device||DEV.status?`<span class="dot ${DEV.last?"ok":DEV.device&&DEV.device.gatt&&DEV.device.gatt.connected?"wait":"off"}"></span><div style="flex:1;min-width:0"><div style="font-weight:600">${esc(DEV.name||"No device")}</div><div class="muted small">${esc(DEV.status)}</div></div>${DEV.hz?`<span class="chip">${DEV.hz} Hz</span>`:""}${DEV.sats!=null?`<span class="chip">${DEV.sats} sats</span>`:""}${DEV.battery!=null?`<span class="chip">${DEV.battery}% battery</span>`:""}`:`<span class="dot"></span><span class="muted small">No device connected</span>`}

// Phone motion sensors: horizontal g (gravity removed), peak between GPS fixes
const MOT={on:false,peak:0,handler:null};
async function startMotion(){
  if(!S.settings.motion||MOT.on||typeof DeviceMotionEvent==="undefined")return;
  try{if(typeof DeviceMotionEvent.requestPermission==="function"){const r=await DeviceMotionEvent.requestPermission();if(r!=="granted")return}}catch(e){return}
  MOT.handler=e=>{const a=e.acceleration,ai=e.accelerationIncludingGravity;if(!a||!ai||a.x==null||ai.x==null)return;
    const gx=ai.x-a.x,gy=ai.y-a.y,gz=ai.z-a.z,gn=Math.hypot(gx,gy,gz)||1;
    const dot=(a.x*gx+a.y*gy+a.z*gz)/gn;const hx=a.x-dot*gx/gn,hy=a.y-dot*gy/gn,hz=a.z-dot*gz/gn;
    const g=Math.hypot(hx,hy,hz)/G;if(g<3)MOT.peak=Math.max(MOT.peak,g)};
  window.addEventListener("devicemotion",MOT.handler);MOT.on=true;
}
function stopMotion(){if(MOT.handler)window.removeEventListener("devicemotion",MOT.handler);MOT.on=false;MOT.handler=null;MOT.peak=0}

function bindHold(btn){
  let t0=0,raf=0;const fill=btn.querySelector(".fill");
  const stopAnim=()=>{cancelAnimationFrame(raf);fill.style.transform="scaleX(0)"};
  const run=()=>{t0=performance.now();const step=()=>{const k=(performance.now()-t0)/1000;fill.style.transform=`scaleX(${Math.min(1,k)})`;if(k>=1){stopAnim();finishRec()}else raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)};
  btn.onpointerdown=e=>{if(!REC.on){startRec();return}btn.setPointerCapture?.(e.pointerId);run()};
  btn.onpointerup=btn.onpointercancel=btn.onpointerleave=stopAnim;
  btn.onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&!e.repeat){e.preventDefault();if(REC.on)run();else startRec()}};
  btn.onkeyup=stopAnim;
}
function setGps(cls,txt){const d=document.querySelector("#gps .dot"),t=$("#gps-t");if(d)d.className="dot "+cls;if(t)t.textContent=txt}

const CAM={stream:null,rec:null,key:null,t0:0,n:0,type:"",writes:[]};
async function startCam(){

    if(!navigator.mediaDevices||typeof MediaRecorder==="undefined")throw new Error("unsupported");

    if(!REC.on){stopCam(true);return}
    CAM.type=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||"";
    CAM.rec=new MediaRecorder(CAM.stream,{...(CAM.type?{mimeType:CAM.type}:{}),videoBitsPerSecond:2.5e6});
    CAM.key="video:"+uid();CAM.n=0;CAM.writes=[];

    CAM.rec.ondataavailable=e=>{if(e.data&&e.data.size)CAM.writes.push(photos.put(CAM.key+":"+(CAM.n++),e.data,true))};
    CAM.rec.onstart=()=>{CAM.t0=Date.now()};

    const cp=$("#cam-prev");if(cp){cp.srcObject=CAM.stream;cp.play().catch(()=>{})}else if(current==="record")viewRecord();
  }catch(e){CAM.stream=null;toast("Camera unavailable, recording data only.")}
}
async function stopCam(discard){
  const r=CAM.rec,st=CAM.stream,out=r&&!discard?{key:CAM.key,t0:CAM.t0,type:(r.mimeType||CAM.type||"video/mp4").split(";")[0]}:null;
  CAM.rec=null;CAM.stream=null;
  if(r&&r.state!=="inactive"){await new Promise(res=>{r.onstop=res;try{r.stop()}catch(e){res()}})}

async function driveVideo(v){const parts=[];for(let i=0;;i++){const b=await photos.get(v.key+":"+i);if(!b)break;parts.push(b)}return parts.length?new Blob(parts,{type:v.type}):null}

function startRec(){
  const src=S.settings.source;
  if(src!=="phone"&&!(DEV.device&&DEV.device.gatt&&DEV.device.gatt.connected)){toast(`Connect your ${SOURCES[src].name} first, or switch to Phone GPS.`);return}
  REC.on=true;REC.pts=[];REC.start=Date.now();REC.lastStill=null;REC.source=src==="phone"?"Phone GPS":DEV.name||SOURCES[src].name;

      if(!REC.pts.length){stopSensors();REC.on=false;viewRecord();setGps("off",err.code===1?"Location is blocked here. Allow location for this site and try again.":"No GPS signal. Try again outdoors.")}
      else setGps("off","GPS signal lost");
    },{enableHighAccuracy:true,maximumAge:0,timeout:20000});
  }else setGps("ok","Recording from "+REC.source);

function ingest(f){
  if(!REC.on||!isFinite(f.lat)||!isFinite(f.lon))return;
  const p=[f.lat,f.lon,f.t,f.v,f.alt==null?null:f.alt,f.gLong,f.gLat,f.gTot];
  const last=REC.pts[REC.pts.length-1];
  if(last&&p[2]<=last[2])return;
  if(last&&p[3]>90)return;
  // while parked, keep one point every 2 s, but always keep the last one before the car moves off
  if(p[3]<=0.5&&last&&last[3]<=0.5&&p[2]-last[2]<2000){REC.lastStill=p;return}
  if(REC.lastStill&&p[3]>0.5){REC.pts.push(REC.lastStill)}
  REC.lastStill=null;REC.pts.push(p);
  setGps("ok",`Recording · ${REC.source}${f.acc?` · ±${Math.round(f.acc)} m`:""}`);
}
function updateLive(){
  const pts=REC.pts;const n=pts.length;
  let dist=0;for(let i=1;i<n;i++)dist+=hav(pts[i-1],pts[i]);
  const el=n>1?(pts[n-1][2]-pts[0][2])/1000:(REC.on?(Date.now()-REC.start)/1000:0);
  const alt=n&&pts[n-1][4]!=null?Math.round(fAlt(pts[n-1][4])):null;
  const set=(id,h)=>{const e=document.getElementById(id);if(e)e.innerHTML=h};
  set("g-dist",`${fDist(dist).toFixed(2)}<small>${dLabel()}</small>`);set("g-time",fDur(el));set("g-alt",alt==null?"–":`${alt}<small>${aLabel()}</small>`);
  const c=$("#live-route");if(c)drawRoute(c,thinLive(pts),{live:true,noEnds:n<2});
  const moving=REC.on&&n>2&&pts[n-1][3]>4;const dm=$("#drivemode");
  if(moving&&dm.hidden&&!REC.dismissed){dm.hidden=false;dm.innerHTML=`<div class="road">Eyes on the road${CAM.rec?' <span class="rec-dot">● REC</span>':""}</div>
    <div class="stack" style="align-items:center;text-align:center"><div class="gauge big"><div class="k">Distance</div><div class="v num" id="dm-dist"></div></div><div class="gauge"><div class="k">Time</div><div class="v num" id="dm-time"></div></div></div>
    <div class="stack"><button class="rec-btn stop" id="dm-btn" type="button"><span class="fill"></span><span class="lbl">Hold to finish</span></button><button class="btn ghost" id="dm-x" type="button" style="justify-content:center">I'm a passenger, show full screen</button></div>`;
    bindHold($("#dm-btn"));$("#dm-x").onclick=()=>{REC.dismissed=true;dm.hidden=true}}
  set("dm-dist",`${fDist(dist).toFixed(1)}<small>${dLabel()}</small>`);set("dm-time",fDur(el));
  const b=$("#rec-btn");if(b){b.classList.toggle("stop",REC.on);b.querySelector(".lbl").textContent=REC.on?"Hold to finish":"Start drive"}
}
function thinLive(p){if(p.length<1500)return p;const k=Math.ceil(p.length/1500);return p.filter((_,i)=>i%k===0||i===p.length-1)}

function finishRec(){

function runsTable(st){

    const best=`<tr><th scope="row">${r.label}${all.length>1?`<div class="muted small">Best of ${all.length}</div>`:""}</th><td class="t">${v.trap?`${Math.round(fSpeed(v.trap))} ${sLabel()} trap`:""}</td><td class="v best">${fSec(v.t)}</td></tr>`;
    if(all.length<2)return best;
    return best+`<tr class="attempts"><td colspan="3"><details><summary>All ${all.length} ${r.label} runs</summary><ol>${all.map((x,i)=>`<li${x.t===v.t?' class="is-best"':""}><span>Run ${i+1}${x.at!=null?` · ${fDur(x.at)} into the drive`:""}${x.trap?` · ${Math.round(fSpeed(x.trap))} ${sLabel()} trap`:""}</span><b class="num">${fSec(x.t)}</b></li>`).join("")}</ol></details></td></tr>`}).join("");

function telemetry(d){
  const P=d.pts,n=P.length,t0=P[0][2];const T=P.map(p=>(p[2]-t0)/1000);

    at(t){t=Math.max(0,Math.min(T[n-1],t));let lo=0,hi=n-1;while(hi-lo>1){const m=(lo+hi)>>1;if(T[m]<=t)lo=m;else hi=m}

}

// Drives by different people that cover the same roads at the same time become a cruise.
// Only drives you can already see are compared, so grouping never reveals anything new.
const CRUISE_COLORS=["#0a84ff","#ff7a45","#3fbf8a","#bf5af2","#ffd60a","#ff375f","#64d2ff"];
function posAt(pts,t){if(!pts.length||t<pts[0][2]||t>pts[pts.length-1][2])return null;let lo=0,hi=pts.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(pts[m][2]<=t)lo=m;else hi=m}
  const a=pts[lo],b=pts[hi],f=b[2]>a[2]?(t-a[2])/(b[2]-a[2]):0;return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]}
function droveTogether(a,b){
  if(a.who===b.who||a.pts.length<2||b.pts.length<2)return false;
  const t0=Math.max(a.pts[0][2],b.pts[0][2]),t1=Math.min(a.pts[a.pts.length-1][2],b.pts[b.pts.length-1][2]);if(t1-t0<120e3)return false;
  let n=0,hit=0;for(let t=t0;t<=t1;t+=15e3){const p=posAt(a.pts,t),q=posAt(b.pts,t);if(!p||!q)continue;n++;if(hav(p,q)<600)hit++}
  return n>=8&&hit/n>=.6;
}
let CRUISE_CACHE={key:"",groups:[]};
function cruises(drives){
  const key=drives.map(d=>d.id+":"+d.pts.length).sort().join("|");if(key===CRUISE_CACHE.key)return CRUISE_CACHE.groups;
  const ds=drives.filter(d=>d.pts.length>1).sort((a,b)=>a.start-b.start),parent=new Map(ds.map(d=>[d.id,d.id]));
  const find=x=>{while(parent.get(x)!==x){parent.set(x,parent.get(parent.get(x)));x=parent.get(x)}return x};
  for(let i=0;i<ds.length;i++)for(let j=i+1;j<ds.length;j++){if(ds[j].start>ds[i].pts[ds[i].pts.length-1][2])break;if(droveTogether(ds[i],ds[j]))parent.set(find(ds[j].id),find(ds[i].id))}
  const by=new Map();for(const d of ds){const r=find(d.id);if(!by.has(r))by.set(r,[]);by.get(r).push(d)}
  const groups=[...by.values()].filter(g=>new Set(g.map(d=>d.who)).size>1).map(g=>({id:"c-"+g[0].id,drives:g,start:g[0].start}));
  CRUISE_CACHE={key,groups};return groups;
}
function cruiseOf(d){return cruises(allDrives()).find(g=>g.drives.includes(d))}
function cruiseTitle(g){const names=g.drives.map(d=>d.who==="me"?"You":person(d.who).name.split(" ")[0]);return names.length>3?`${names.slice(0,2).join(", ")} and ${names.length-2} others`:names.slice(0,-1).join(", ")+" and "+names[names.length-1]}

  const lines=(g,P,lw)=>drives.forEach((d,i)=>{strokePath(g,P,d.pts,"rgba(0,0,0,.35)",lw+3);strokePath(g,P,d.pts,CRUISE_COLORS[i%CRUISE_COLORS.length],lw)});

// Group drives by area so a trip across the state doesn't shrink local roads to a dot.
function areas(drives){
  const out=[];
  for(const d of drives){if(d.pts.length<2)continue;const c=d.pts[Math.floor(d.pts.length/2)];
    let a=out.find(x=>hav(x.center,c)<25000);if(!a){a={center:c,drives:[]};out.push(a)}a.drives.push(d)}
  return out.sort((x,y)=>y.drives.length-x.drives.length);
}
function drawHeat(c,drives){
  const k=backdrop(),ink=routeInk(k);
  if(BACKDROPS[k].map){const all=[].concat(...drives.map(d=>d.pts));const {g,w,h}=sizeCanvas(c);g.fillStyle=css("--surface-2");g.fillRect(0,0,w,h);
    const tok=c._tok=(c._tok||0)+1;const ratio=window.devicePixelRatio||1;
    snapshot(k,w,h,ratio,all,24,(g2,P)=>{g2.globalAlpha=Math.max(.3,Math.min(.85,1.8/drives.length));for(const d of drives)strokePath(g2,P,d.pts,ink.route,3.5);g2.globalAlpha=1})
      .then(img=>{if(c._tok!==tok||!c.isConnected)return;const g3=c.getContext("2d");g3.setTransform(1,0,0,1,0,0);g3.drawImage(img,0,0,c.width,c.height)}).catch(()=>{});
    return}
  const {g,w,h}=sizeCanvas(c);g.clearRect(0,0,w,h);
  if(k==="solid"){g.fillStyle=ink.bg;g.fillRect(0,0,w,h)}else{
  g.strokeStyle=css("--grid");g.lineWidth=1;
  for(let x=0;x<w;x+=24){g.beginPath();g.moveTo(x+.5,0);g.lineTo(x+.5,h);g.stroke()}
  for(let y=0;y<h;y+=24){g.beginPath();g.moveTo(0,y+.5);g.lineTo(w,y+.5);g.stroke()}}
  const all=[].concat(...drives.map(d=>d.pts));if(!all.length)return;
  const P=projector(all,w,h,18);
  g.globalAlpha=Math.max(.25,Math.min(.8,1.6/drives.length));
  for(const d of drives)strokePath(g,P,d.pts,ink.route,4);
  g.globalAlpha=1;
}

function routeRow(d){const p=person(d.who);return `<button class="effort open-link" data-open="${d.id}" style="display:flex">${p.handle&&d.who!=="me"?`<span data-user="${esc(p.handle)}" class="user-link">${avatar(p,30)}</span>`:avatar(p,30)}<div style="flex:1;min-width:0"><div style="font-weight:600">${esc(d.title)}</div><div class="muted small">${d.who!=="me"?(p.handle?`<span data-user="${esc(p.handle)}">${nameHtml(p)}</span>`:esc(p.name))+" · ":""}${ago(d.start)} · ${fDist(d.stats.dist).toFixed(1)} ${dLabel()}</div></div>${d.sample?'<span class="chip example">Example</span>':""}</button>`}

// Nearby: drives people shared with Everyone, in the areas where you drive. No live location is used.
async function viewNearby(){
  const head=`<div class="row"><div><div class="eyebrow">Drivers around you</div><h1>Routes</h1></div><span class="spacer"></span>${routeToggle()}</div>`;
  const v=$("#view");
  if(!Social.ready()){v.innerHTML=`<div class="stack">${head}<div class="notice">${Social.ok()?"Pick your @handle on your <a href=\"#you\">profile page</a>":"Sign in on your <a href=\"#you\">profile page</a>"} to see drivers near you.</div></div>`;bindRoutes([]);return}
  v.innerHTML=`<div class="stack">${head}<div class="empty">Looking for drivers near you…</div></div>`;bindRoutes([]);
  let pub;try{pub=await Social.nearby()}catch(e){if(routeWho==="near"&&current==="routes")v.innerHTML=`<div class="stack">${head}<div class="empty">Couldn't reach the server. Check your connection.</div></div>`;bindRoutes([]);return}
  if(routeWho!=="near"||current!=="routes"||location.hash.slice(1)!=="routes")return;
  const homes=areas(S.drives.filter(isReal)).map(a=>a.center);
  const mid=d=>d.pts[Math.floor(d.pts.length/2)];
  const near=homes.length?pub.filter(d=>d.pts.length>1&&homes.some(c=>hav(c,mid(d))<50000)):pub.filter(d=>d.pts.length>1);
  const fol=Social.SOC.following;const people=[];for(const d of near){const id=d.who.slice(2);if(!people.includes(id))people.push(id)}
  const newPeople=people.filter(id=>!fol.has(id)).slice(0,12);
  const ar=areas(near.slice(0,60));
  v.innerHTML=`<div class="stack">${head}
    <p class="muted" style="margin:0">${homes.length?"Drives shared with Everyone in the areas where you drive.":"Recent drives shared with Everyone. Record a drive to see the ones near you."} Only drives people made public show here, with the start and end of each route hidden.</p>
    ${newPeople.length?`<div class="panel"><h3>Drivers to follow</h3><div class="stack" style="gap:0">${newPeople.map(id=>{const pp=Social.person("u:"+id),n=near.filter(d=>d.who==="u:"+id).length;return `<div class="effort" style="display:flex;align-items:center"><a href="#u/${esc(pp.handle)}" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-decoration:none;color:inherit">${avatar(pp,36)}<div style="min-width:0"><div style="font-weight:600">${nameHtml(pp)}</div><div class="muted small">@${esc(pp.handle)} · ${n} ${n===1?"drive":"drives"}${homes.length?" nearby":""}</div></div></a><button class="btn" data-follow="${id}" type="button">Follow</button></div>`}).join("")}</div></div>`:""}
    ${near.length?stylePicker()+areaCards(ar):`<div class="empty">No public drives ${homes.length?"near you ":""}yet. When people share drives with Everyone, they'll show up here.</div>`}
  </div>`;
  bindRoutes(ar);
  document.querySelectorAll("[data-follow]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await Social.follow(b.dataset.follow,true);b.textContent="Following";toast("Following @"+Social.person("u:"+b.dataset.follow).handle)}catch(e){b.disabled=false;toast("Couldn't reach the server")}});
}

/* ================= you ================= */
function viewYou(){
  const mine=S.drives.filter(d=>d.who==="me").sort((a,b)=>b.start-a.start);
  const tot=mine.reduce((a,d)=>({dist:a.dist+d.stats.dist,top:Math.max(a.top,d.stats.max),up:a.up+(d.stats.up||0),g:Math.max(a.g,d.stats.gTot||0)}),{dist:0,top:0,up:0,g:0});
  const pb={};for(const d of mine)for(const r of RUN_DEFS){const v=d.stats.runs&&d.stats.runs[r.k];if(v&&(!pb[r.k]||v.t<pb[r.k].v.t))pb[r.k]={v,d}}
  const weeks=[];const wk=7*864e5,now=Date.now();
  for(let i=5;i>=0;i--){const a=now-(i+1)*wk,b=now-i*wk;const wd=mine.filter(d=>d.start>a&&d.start<=b);weeks.push({label:i===0?"Now":`-${i}w`,v:wd.length,dist:wd.reduce((s,d)=>s+fDist(d.stats.dist),0)})}
  const wkDist=weeks.reduce((s,w)=>s+w.dist,0);
  const mx=Math.max(1,...weeks.map(w=>w.v));
  $("#view").innerHTML=`<div class="stack">
    <div><div class="eyebrow">Your logbook and settings</div><h1>You</h1></div>
    <div class="panel"><div class="profile">${avatar(person("me"),84)}
      <div class="stack" style="flex:1;min-width:200px;gap:8px">
        <label class="field">Name on share cards<input type="text" id="me-name" value="${esc(S.settings.name||"")}" placeholder="Your name or handle" maxlength="40"></label>
        <div class="row"><button class="btn" id="av-pick" type="button">${S.settings.avatar?"Change photo":"Add a profile photo"}</button>${S.settings.avatar?`<button class="btn ghost" id="av-rm" type="button">Remove</button>`:""}</div>
      </div></div></div>
    <div class="panel"><h3>Your drives</h3>${mine.map(d=>`<button class="effort open-link" data-open="${d.id}" style="display:flex"><div style="flex:1;min-width:0"><div style="font-weight:600">${esc(d.title)}</div><div class="muted small">${ago(d.start)} · ${fDist(d.stats.dist).toFixed(1)} ${dLabel()} · top ${Math.round(fSpeed(d.stats.max))} ${sLabel()}</div></div>${headlineRun(d.stats)?`<span class="chip run">${headlineRun(d.stats).label} ${fSec(headlineRun(d.stats).v.t)}</span>`:""}</button>`).join("")||'<p class="muted" style="margin:0">Nothing recorded yet.</p>'}</div>
    <div class="panel"><h3>Garage</h3><p class="muted small" style="margin:0">Cars, bikes, boats, anything you drive. Tap one to add photos and list your mods.${Social.ready()?" Vehicles show on your profile unless you make them private.":""}</p>
      ${S.settings.vehicles.map((v,i)=>{const gi=(S.settings.garage||{})[v]||{};const np=(gi.photoAt?1:0)+(gi.photos||[]).length;return `<button class="veh-row" data-vehopen="${i}" type="button"><span class="veh-thumb">${gi.photoAt?`<img data-vehimg="${esc(v)}" alt="">`:`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`}</span>
        <span style="flex:1;min-width:0;text-align:left"><span style="display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v)}</span><span class="muted small">${[v===S.settings.vehicle?"Default":"",gi.priv?"🔒 Private":"",np?np+(np===1?" photo":" photos"):"",gi.about?"Mods listed":""].filter(Boolean).join(" · ")||"Tap to add photos and mods"}</span></span><span class="muted" aria-hidden="true">›</span></button>`}).join("")}
      <form class="row" id="veh-form"><input type="text" id="veh-in" placeholder="Add a vehicle, e.g. 2018 Civic Si or Ducati Monster" style="flex:1;min-width:0" maxlength="60"><button class="btn" type="submit">Add</button></form>
    </div>
    <div class="detail-stats">${statBlock("Drives",mine.length)}${statBlock("Distance",fDist(tot.dist).toFixed(0),dLabel())}${statBlock("Climbed",Math.round(fAlt(tot.up)),aLabel())}${statBlock("Top speed",Math.round(fSpeed(tot.top)),sLabel())}${statBlock("Max g",fG(tot.g),"g")}</div>
    <div class="panel"><h3>Personal bests</h3>${Object.keys(pb).length?`<table class="runs"><tbody>${RUN_DEFS.filter(r=>pb[r.k]).map(r=>`<tr><th scope="row">${r.label}</th><td class="t"><button class="open-link muted small" data-open="${pb[r.k].d.id}" style="text-align:right">${esc(pb[r.k].d.title)}</button></td><td class="v">${fSec(pb[r.k].v.t)}</td></tr>`).join("")}</tbody></table>`:'<p class="muted" style="margin:0">Record a run from a standing start to set your first times.</p>'}</div>
    <div class="panel"><div class="row"><h3>Drives per week</h3><span class="spacer"></span><span class="muted small">${wkDist.toFixed(wkDist<10?1:0)} ${dLabel()} in the last 6 weeks</span></div>
      <div class="bars" role="img" aria-label="Drives per week">${weeks.map(w=>`<div class="b"><span class="num">${w.v||""}</span><i style="height:${w.v/mx*80}%"></i><span>${w.label}</span></div>`).join("")}</div></div>
    <div class="panel"><h3>Map style</h3><p class="muted small" style="margin:0">Used behind routes everywhere, including share cards.</p>${stylePicker()}</div>
    <div class="panel"><div class="row"><h3>Units</h3><span class="spacer"></span>
      <div class="unit-toggle" role="group" aria-label="Units"><button id="u-mi" type="button" aria-pressed="${U()==="mi"}">Miles</button><button id="u-km" type="button" aria-pressed="${U()==="km"}">Kilometers</button></div></div></div>
    ${Social.ok()&&Social.SOC.loaded&&!Social.me?`<div class="panel"><h3>Pick your @handle</h3><p class="muted small" style="margin:0">This is how friends find and follow you. Lowercase letters, numbers and _ only.</p>
      <form class="row" id="h-form"><span style="font-weight:700">@</span><input type="text" id="h-in" placeholder="burnout" pattern="[a-z0-9_]{3,20}" maxlength="20" autocapitalize="none" autocomplete="username" style="flex:1;min-width:0" required><button class="btn primary" type="submit">Claim it</button></form></div>`:""}
    ${Social.ready()?`<div class="panel"><div class="row"><h3>Friends</h3><span class="spacer"></span><a class="muted small" href="#u/${esc(Social.me.handle)}">@${esc(Social.me.handle)}</a></div>
      <p class="muted small" style="margin:0"><a href="#u/${esc(Social.me.handle)}">Following ${Social.SOC.following.size}</a>. Your drives go to your followers unless you choose otherwise.</p>
      <div class="row"><button class="btn primary" id="inv" type="button">Invite friends</button></div>
      <form class="row" id="f-form"><input type="search" id="f-in" placeholder="Find people by @handle" autocapitalize="none" style="flex:1;min-width:0"><button class="btn" type="submit">Search</button></form>
      <div id="f-res" class="stack" style="gap:0"></div>
      <label class="field">New drives are visible to<select id="def-vis"><option value="followers" ${(S.settings.defaultVis||"followers")==="followers"?"selected":""}>Followers</option><option value="public" ${S.settings.defaultVis==="public"?"selected":""}>Everyone</option><option value="private" ${S.settings.defaultVis==="private"?"selected":""}>Only me</option></select></label>
      <label class="check"><input type="checkbox" id="hide-ends" ${S.settings.hideEnds!==false?"checked":""}> Hide the first and last 300 m of shared routes, so they don't show where you live</label></div>`:""}
    ${Sync.on()?`<div class="panel"><h3>${Sync.user?"Account":signinIntent==="new"?"Create an account":signinIntent==="in"?"Sign in":"Sign in or create an account"}</h3>${Sync.user?`<p style="margin:0">Signed in as <b>${esc(Sync.user.email||"")}</b>${Social.me?` · <a href="#u/${esc(Social.me.handle)}">@${esc(Social.me.handle)}</a>`:""}. Your profile, garage, drives and photos sync to every device you sign in on.</p>
      <div class="row"><span class="muted small" id="sync-status" style="flex:1">${esc(Sync.status)}</span><button class="btn" id="sync-now" type="button">Sync now</button><button class="btn ghost" id="sync-out" type="button">Sign out</button></div>`
      :`<p class="muted" style="margin:0">Sign in or create an account to follow friends and keep your profile, garage, drives and photos on all your devices. We email you a sign-in link, no password needed.</p>
      <form class="row" id="sync-form"><input type="email" id="sync-email" placeholder="you@example.com" autocomplete="email" style="flex:1;min-width:0" required><button class="btn primary" type="submit">Email me a link</button></form>
      <p class="muted small" id="sync-sent" hidden style="margin:0">Check your email and tap the link. Using the Home Screen app on iPhone? Type the code from the same email here instead.</p>
      <form class="row" id="sync-code-form" hidden><input type="text" id="sync-code" inputmode="numeric" autocomplete="one-time-code" placeholder="Code from the email" maxlength="10" style="flex:1;min-width:0" required><button class="btn primary" type="submit">Sign in</button></form>`}</div>`:""}
  </div>`;
  $("#me-name").onchange=e=>{S.settings.name=e.target.value.trim();save();toast("Name saved")};
  $("#av-pick").onclick=()=>pickImage(async f=>{await photos.put("avatar:me",await squareCrop(f,400));S.settings.avatar=true;S.settings.avatarAt=Date.now();save();await loadAvatar();render();toast("Profile photo updated")});
  const rmav=$("#av-rm");if(rmav)rmav.onclick=async()=>{await photos.del("avatar:me");S.settings.avatar=false;AV.url=null;save();render();toast("Profile photo removed")};
  $("#u-mi").onclick=()=>{S.settings.units="mi";save();viewYou()};$("#u-km").onclick=()=>{S.settings.units="km";save();viewYou()};
  const VN=i=>S.settings.vehicles[+i];const GI=n=>{S.settings.garage=S.settings.garage||{};return S.settings.garage[n]=S.settings.garage[n]||{}};
  document.querySelectorAll("[data-vehopen]").forEach(b=>b.onclick=()=>openVehicle({name:VN(b.dataset.vehopen)}));
  document.querySelectorAll("img[data-vehimg]").forEach(async im=>{const u=await photos.url("veh:"+im.dataset.vehimg);if(u)im.src=u});
  $("#veh-form").onsubmit=e=>{e.preventDefault();const v=$("#veh-in").value.trim();if(!v)return;if(!S.settings.vehicles.includes(v))S.settings.vehicles.push(v);S.settings.vehicle=v;save();viewYou();toast("Vehicle added")};
  if(Sync.on()){
    if(signinIntent&&$("#sync-email")){const em=$("#sync-email");em.closest(".panel").scrollIntoView({block:"center"});em.focus();signinIntent=null}
    const sf=$("#sync-form");if(sf)sf.onsubmit=async e=>{e.preventDefault();const em=$("#sync-email").value.trim();const b=sf.querySelector("button");b.disabled=true;try{await Sync.sendCode(em);sf.hidden=true;$("#sync-sent").hidden=false;$("#sync-code-form").hidden=false;toast("Sign-in email sent")}catch(err){toast(err.message)}b.disabled=false};
    const cf=$("#sync-code-form");if(cf)cf.onsubmit=async e=>{e.preventDefault();const b=cf.querySelector("button");b.disabled=true;try{await Sync.verify($("#sync-email").value.trim(),$("#sync-code").value.replace(/\D/g,""));toast("Signed in, syncing");viewYou()}catch(err){toast(err.message)}b.disabled=false};
    const sn=$("#sync-now");if(sn)sn.onclick=()=>Sync.run();
    const so=$("#sync-out");if(so)so.onclick=async()=>{so.disabled=true;so.textContent="Signing out…";await Sync.signOut();render();toast("Signed out")};
  }
  const hf=$("#h-form");if(hf)hf.onsubmit=async e=>{e.preventDefault();const h=$("#h-in").value.trim().toLowerCase();if(!/^[a-z0-9_]{3,20}$/.test(h)){toast("Use 3–20 lowercase letters, numbers or _");return}const b=hf.querySelector("button");b.disabled=true;try{await Social.claim(h);toast("You're @"+h);viewYou()}catch(err){toast(err.message)}b.disabled=false};
  const inv=$("#inv");if(inv)inv.onclick=async()=>{const url=location.origin+location.pathname+"#u/"+Social.me.handle,text=`Follow me on Dragon Drive: ${url}`;
    try{if(navigator.share){await navigator.share({title:"Dragon Drive",text,url});return}await navigator.clipboard.writeText(url);toast("Invite link copied")}catch(e){}};
  const ff=$("#f-form");if(ff)ff.onsubmit=async e=>{e.preventDefault();const box=$("#f-res");box.innerHTML='<p class="muted small" style="margin:0">Searching…</p>';
    try{const r=await Social.search($("#f-in").value);box.innerHTML=r.length?r.map(p=>{const pp=Social.person("u:"+p.id);return `<a class="effort" href="#u/${esc(p.handle)}" style="display:flex;text-decoration:none;color:inherit">${avatar(pp,32)}<div style="flex:1;min-width:0"><div style="font-weight:600">${nameHtml(pp)}</div><div class="muted small">@${esc(p.handle)}${Social.SOC.following.has(p.id)?" · Following":""}</div></div></a>`}).join(""):'<p class="muted small" style="margin:0">Nobody by that handle yet.</p>'}catch(err){box.innerHTML='<p class="muted small" style="margin:0">Search failed. Check your connection.</p>'}};
  const dvs=$("#def-vis");if(dvs)dvs.onchange=e=>{S.settings.defaultVis=e.target.value;save();toast("Saved")};
  const he=$("#hide-ends");if(he)he.onchange=e=>{S.settings.hideEnds=e.target.checked;save()};
}

/* ================= global events ================= */
document.addEventListener("click",e=>{
  const br=e.target.closest("#brand");if(br){if(location.hash==="#feed"||location.hash===""){e.preventDefault();if(!$("#sheet").hidden)closeSheet();else window.scrollTo({top:0,behavior:"smooth"})}return}
  const si=e.target.closest("[data-signin]");if(si){signinIntent=si.dataset.signin;if(location.hash==="#you"){e.preventDefault();render()}}
  const us=e.target.closest("[data-user]");if(us){e.preventDefault();e.stopPropagation();location.hash="#u/"+us.dataset.user;return}
  const k=e.target.closest("[data-kudos]");if(k&&!k.disabled){e.preventDefault();const id=k.dataset.kudos;const d=findDrive(id);
    (async()=>{if(Social.ok()&&Social.published(d)){try{await Social.toggleKudos(id)}catch(err){toast("Couldn't reach the server");return}}else{S.kudos[id]=!S.kudos[id];save()}
      k.setAttribute("aria-pressed",kudosMine(d));k.querySelector("span").textContent=kudosCount(d);if(kudosMine(d))toast("Kudos given")})();return}
  const ms=e.target.closest("[data-mapstyle]");if(ms){S.settings.mapStyle=ms.dataset.mapstyle;save();rerender();return}
  const sh=e.target.closest("[data-share]");if(sh){e.preventDefault();openShare(sh.dataset.share);return}
  const o=e.target.closest("[data-open]");if(o){e.preventDefault();openDrive(o.dataset.open);return}
  const cr=e.target.closest("[data-cruise]");if(cr){e.preventDefault();openCruise(cr.dataset.cruise)}
});

document.addEventListener("change",e=>{if(e.target.id==="solid-color"){S.settings.solidColor=e.target.value;save();rerender()}});
// Re-draw after a setting change without losing the reader's place.
function rerender(){const sh=$("#sheet");
  if(SHEET&&!sh.hidden){if(SHEET.kind==="video")return;const y=sh.scrollTop;if(SHEET.kind==="cruise"){openCruise(SHEET.id);sh.scrollTop=y;return}if(SHEET.kind==="vehicle"){openVehicle(SHEET.spec);sh.scrollTop=y;return}if(SHEET.kind==="share")openShare(SHEET.id,SHEET.back);else openDrive(SHEET.id);sh.scrollTop=y}
  else{const y=window.scrollY;render();window.scrollTo(0,y)}}
window.addEventListener("hashchange",()=>{if(!$("#sheet").hidden){if(DETAIL_MAP){DETAIL_MAP.remove();DETAIL_MAP=null}SHEET=null;$("#sheet").hidden=true;document.body.style.overflow=""}render();if(pendingOpen){const id=pendingOpen;pendingOpen=null;openDrive(id,true)}});
let rz,lastW=window.innerWidth;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(window.innerWidth===lastW)return;lastW=window.innerWidth;if($("#sheet").hidden)render()},200)});
const authHash=/access_token=|error_description=/.test(location.hash)?location.hash:null;if(authHash)history.replaceState(null,"",location.pathname+"#you");
render();loadAvatar();
// Pull to refresh. Home Screen apps don't get the browser's own, so we draw one: pull down at the top,
// let go past the line, and the app saves and syncs, then reloads with the newest version and data.
(()=>{const standalone=navigator.standalone||matchMedia("(display-mode: standalone)").matches;if(!standalone||!("ontouchstart" in window))return;
  document.documentElement.style.overscrollBehaviorY="contain";
  const el=document.createElement("div");el.className="ptr";el.setAttribute("aria-hidden","true");el.innerHTML=document.querySelector("nav.tabs a.rec-tab .ring svg").outerHTML;document.body.appendChild(el);
  const MAX=110,GO=70;let y0=null,dy=0,busy=false;
  const blocked=()=>busy||!$("#sheet").hidden||REC.on||window.scrollY>0;
  addEventListener("touchstart",e=>{if(blocked()||e.touches.length!==1){y0=null;return}y0=e.touches[0].clientY;dy=0},{passive:true});
  addEventListener("touchmove",e=>{if(y0==null)return;dy=Math.max(0,Math.min(MAX,(e.touches[0].clientY-y0)*.5));if(window.scrollY>0){dy=0}
    el.style.transform=`translate(-50%,${dy-50}px) rotate(${dy*4}deg)`;el.style.opacity=Math.min(1,dy/GO);el.classList.toggle("ready",dy>=GO)},{passive:true});
  addEventListener("touchend",async()=>{if(y0==null)return;y0=null;if(dy<GO){el.style.transition="transform .2s,opacity .2s";el.style.transform="translate(-50%,-50px)";el.style.opacity=0;setTimeout(()=>el.style.transition="",220);return}
    busy=true;el.classList.add("spin");el.style.transform=`translate(-50%,${GO-50}px)`;
    try{await Promise.race([Sync.run(),new Promise(r=>setTimeout(r,4000))])}catch(e){}location.reload()});
})();
if(authHash&&/error_description=/.test(authHash))toast("That sign-in link has expired. Request a new one.");
if(authHash&&/access_token=/.test(authHash))Sync.fromLink(authHash).then(()=>Social.refresh()).then(()=>rerender());else Sync.run().then(()=>Social.refresh());try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
</script>

<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});</script>
