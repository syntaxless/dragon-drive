<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b6e4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Dragon Drive</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=UnifrakturCook:wght@700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one-column phone app, sticky header, fixed bottom tab bar; road-sign green accent, amber for routes, red-orange for highlights */
:root{
  --bg:#eef1f0; --surface:#ffffff; --surface-2:#e3e8e6; --line:#d2d9d6;
  --fg:#16201c; --muted:#5b6a64; --accent:#0b6e4f; --accent-fg:#ffffff;
  --route:#007aff; --hl:#e04f1a; --good:#1d8a52; --warn:#b7791f; --bad:#c2410c; --alt:#5b6fd6;
  --grid:rgba(22,32,28,.07);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --logo:"UnifrakturCook","Old English Text MT",serif;
  --tab-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#18201d; --surface-2:#212b27; --line:#2c3833;
  --fg:#e7eeeb; --muted:#94a39d; --accent:#3fbf8a; --accent-fg:#06110c;
  --route:#0a84ff; --hl:#ff7a45; --good:#4cc787; --warn:#e3a83f; --bad:#ff8a5c; --alt:#8c9cff;
  --grid:rgba(231,238,235,.07); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#18201d; --surface-2:#212b27; --line:#2c3833;
  --fg:#e7eeeb; --muted:#94a39d; --accent:#3fbf8a; --accent-fg:#06110c;
  --route:#0a84ff; --hl:#ff7a45; --good:#4cc787; --warn:#e3a83f; --bad:#ff8a5c; --alt:#8c9cff;
  --grid:rgba(231,238,235,.07); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
html{touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{color:inherit;text-decoration:none;display:flex;align-items:center;gap:10px;font-family:var(--logo);font-weight:700;font-size:27px;letter-spacing:.01em;line-height:1}
.brand .logo{display:flex;flex:none}.brand .logo svg{display:block}
.unit-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.unit-toggle button{border:0;background:transparent;padding:4px 10px;font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.unit-toggle button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
main{padding-block:16px calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:30px;text-transform:uppercase}
h2{font-size:22px}
h3{font-size:18px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:currentColor;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.veh-row{display:flex;gap:12px;align-items:center;padding:8px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;font:inherit;color:inherit;cursor:pointer}
.veh-gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.veh-gallery figure{margin:0;position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2)}.veh-gallery figure.cover{grid-column:1/-1}.veh-gallery img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.veh-gallery figure.cover img{aspect-ratio:16/10}
.pic-x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px;line-height:1}
.veh-about{margin:0;white-space:pre-wrap}.garage-grid figure[role=button]{cursor:pointer}
.veh-thumb{width:64px;height:48px;border-radius:10px;border:1px dashed var(--line);background:var(--surface-2);color:var(--muted);display:grid;place-items:center;overflow:hidden;flex:none;padding:0;cursor:pointer}
.veh-thumb img{width:100%;height:100%;object-fit:cover}
.user-link{display:contents;cursor:pointer;color:inherit}.link-btn{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.notice.signup{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ptr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);left:50%;z-index:30;width:40px;height:40px;padding:4px;border-radius:50%;background:var(--surface);color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.18);transform:translate(-50%,-50px);opacity:0;pointer-events:none}
.ptr svg{width:100%;height:100%;display:block}.ptr.ready{color:var(--hl)}.ptr.spin svg{animation:wheelspin .8s linear infinite}
.viewer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.viewer .vx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:22px;line-height:1}
.photo-edit .photo,.veh-gallery img{cursor:zoom-in}
.card.post{padding-bottom:0}.post-body{margin:0;padding:4px 14px 10px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}.sheet .post-body{padding:0}
.compose textarea{margin:0}
.speed-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.speedo{display:flex;align-items:center;gap:22px;justify-content:center}.speedo .v{font-family:var(--display);font-weight:700;font-size:112px;line-height:.9;font-variant-numeric:tabular-nums}.speedo .k{font-family:var(--display);font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.limit-us{width:64px;border:3px solid #111;border-radius:8px;background:#fff;color:#111;text-align:center;padding:4px 2px;box-shadow:0 0 0 2px #fff}.limit-us span{display:block;font-family:var(--display);font-weight:700;font-size:11px;line-height:1.05;text-transform:uppercase}.limit-us b{display:block;font-family:var(--display);font-size:34px;line-height:1}
.limit-eu{width:72px;height:72px;border-radius:50%;border:8px solid #d0021b;background:#fff;color:#111;display:grid;place-items:center}.limit-eu b{font-family:var(--display);font-size:30px}
.speedo .limit-us{width:84px}.speedo .limit-us b{font-size:46px}.speedo .limit-eu{width:96px;height:96px;border-width:10px}.speedo .limit-eu b{font-size:40px}
.dm-warn{min-height:28px;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.drive-mode.speeding{animation:speedflash 1s steps(1) infinite}.drive-mode.speeding .speedo .v{color:#fff}.drive-mode.speeding .road,.drive-mode.speeding .k,.drive-mode.speeding .muted,.drive-mode.speeding .v small{color:rgba(255,255,255,.85)}.drive-mode.speeding .gauge .v{color:#fff}.drive-mode.speeding .btn.ghost{color:#fff;border-color:rgba(255,255,255,.6)}.drive-mode.speeding .rec-btn.stop{background:#111}
@keyframes speedflash{0%{background:#c2410c}50%{background:#7a1f05}}
.off-route{position:absolute;top:10px;left:10px;background:#111;color:#fff}.off-route:empty{display:none}
.plan-map{height:56vh;min-height:320px;aspect-ratio:auto}
.garage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.garage-grid figure{margin:0;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.garage-grid img,.garage-grid .ph{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--surface-2)}
.garage-grid figcaption{padding:6px 10px;font-weight:600;font-size:14px}
.verified{margin-left:.2em;font-size:.95em;line-height:1}
.cruise-dot{width:10px;height:10px;border-radius:50%;flex:none}
.cruise-badge{background:var(--hl,#f2a93b);color:#111;font-weight:800}
.head-tags{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;flex:none;max-width:45%}
.chip.example{border:1px dashed var(--muted);background:transparent}
.chip.run{color:var(--hl)}
.chip.closed{color:var(--accent)}
input[type=text],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
label.check input{margin-top:3px;accent-color:var(--accent)}

/* feed */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card-head{display:flex;gap:10px;align-items:center;padding:14px 14px 8px}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;font-size:16px}
.card-title{padding:0 14px 8px;min-width:0}
.card-title h3{font-size:20px;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 14px 10px}
.stat{min-width:0}
.stat .k{font-size:12px;color:var(--muted);letter-spacing:.04em}
.stat .v{font-family:var(--display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 12px}
.media{display:grid;grid-template-columns:1fr;gap:2px;background:var(--line)}
.media.two{grid-template-columns:1fr 1fr}
.media.two canvas.route,.media.two .photo{aspect-ratio:1/1}
canvas.route{display:block;width:100%;aspect-ratio:16/9;max-width:100%;background:var(--surface-2)}
.photo{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--surface-2);max-width:100%}
.card-foot{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line);align-items:center}
.kudos{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:6px 8px;border-radius:8px;font-weight:600;color:var(--muted)}
.kudos[aria-pressed="true"]{color:var(--route)}
.kudos svg{width:20px;height:20px}
.open-link{border:0;background:transparent;width:100%;text-align:left;padding:0;display:block}

/* record */
.rec-panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:16px}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dash .big{grid-column:1/-1}
.gauge .k{font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gauge .v{font-family:var(--display);font-weight:700;font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.gauge.big .v{font-size:84px}
.gauge .v small{font-size:20px;color:var(--muted);font-weight:600;margin-left:4px}
.rec-btn{width:100%;border:0;border-radius:16px;padding:22px;font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-fg);position:relative;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.rec-btn.stop{touch-action:none}.rec-btn *{user-select:none;-webkit-user-select:none;pointer-events:none}
.rec-btn.stop{background:var(--bad);color:#fff}
.rec-btn .fill{position:absolute;inset:0;background:rgba(0,0,0,.22);transform-origin:left;transform:scaleX(0)}
.rec-btn .lbl{position:relative}
.gps{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)} .dot.wait{background:var(--warn)} .dot.off{background:var(--bad)}
.notice{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:14px}
.notice strong{font-family:var(--display);letter-spacing:.04em;text-transform:uppercase;font-size:14px}
.sources{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.src{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.src b{font-family:var(--display);font-size:17px;letter-spacing:.02em}
.src span{font-size:12px;color:var(--muted)}
.src[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.src:disabled{opacity:.5}
.dev{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.drive-mode{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;justify-content:space-between;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.drive-mode{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.dm-mid{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.dm-speed,.dm-info{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.dm-mapw{position:relative;width:100%}.dm-mapw canvas{border-radius:14px;aspect-ratio:4/3;max-height:34vh}
.dm-gauges{gap:28px;justify-content:center}
.drive-mode .road{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1.2fr 1fr;height:var(--tab-h)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs a.rec-tab{justify-content:flex-end;gap:3px;padding-bottom:6px}
nav.tabs a.rec-tab span.ring{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;margin-top:-22px;flex:none;box-shadow:0 0 0 4px var(--surface),0 4px 14px rgba(0,0,0,.2)}
nav.tabs a.rec-tab span.ring svg{width:48px;height:48px}
nav.tabs a.rec-tab span.ring svg.spin{animation:wheelspin 1.1s cubic-bezier(.2,.7,.25,1)}
@keyframes wheelspin{from{transform:rotate(0)}to{transform:rotate(1080deg)}}
@media (prefers-reduced-motion:reduce){nav.tabs a.rec-tab span.ring svg.spin{animation:none}}
nav.tabs a.rec-tab .rec-lbl{color:var(--accent);font-size:14px}
nav.tabs a.rec-tab[aria-current="page"] span.ring{box-shadow:0 0 0 4px var(--surface),0 0 0 6px var(--accent)}
img.avatar{object-fit:cover;background:var(--surface-2);padding:0}
.profile{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.profile .avatar{width:84px;height:84px;font-size:30px}
.me-btn{display:block;border-radius:50%;text-decoration:none}
.me-btn[aria-current="page"] .avatar{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:25;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.sheet-bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.sheet .body{padding-block:16px 40px}
.detail-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
canvas.chart{display:block;width:100%;height:160px;max-width:100%}
canvas.gg{display:block;width:100%;max-width:280px;aspect-ratio:1/1;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.runs{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.runs td,.runs th{padding:8px 4px;border-top:1px solid var(--line);text-align:left}
.runs th{font-weight:500;color:var(--muted);font-size:13px}
.runs td.v{font-family:var(--display);font-weight:700;font-size:22px;text-align:right}
.runs td.v.best{color:var(--hl)}
.runs tr.attempts td{border-top:0;padding-top:0}
.runs details summary{cursor:pointer;color:var(--muted);font-size:13px;padding:2px 0}
.runs details ol{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.runs details li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 8px;border-radius:8px;color:var(--muted)}
.runs details li b{font-size:18px;color:var(--fg)}
.runs details li.is-best{background:var(--surface-2)}
.runs details li.is-best b{color:var(--hl)}
.runs td.t{color:var(--muted);text-align:right;font-size:13px;width:6.5em}
.effort{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.effort:first-of-type{border-top:0}
.comment{display:flex;gap:10px;align-items:flex-start}
.comment .avatar{width:30px;height:30px;font-size:13px}
.comment p{margin:0;overflow-wrap:anywhere}
input[type=range]{width:100%;accent-color:var(--hl)}
.map-box{position:relative;z-index:0;isolation:isolate;width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--surface-2)}
.style-pick{gap:6px}
.chip.pick{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:5px 11px;font-size:13px;cursor:pointer}
.chip.pick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip.pick input[type=color]{width:22px;height:22px;border:0;padding:0;background:none;cursor:pointer}
.dm-cam{display:block;width:100%;max-height:22vh;object-fit:cover;border-radius:12px;background:#000}
.cam-prev{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:12px;background:#000;margin-top:10px}.rec-dot{color:#ff453a;font-weight:700;margin-left:8px}
.share-preview{display:block;width:100%;max-width:420px;margin:0 auto;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.photo-edit{position:relative}
.photo-edit .photo{border-radius:14px;aspect-ratio:4/3}

/* ================= storage ================= */
const KEY="roadtripper.v2";
let mem=null;

/* ================= geo + physics ================= */
const R=6371000,rad=d=>d*Math.PI/180,G=9.80665;

function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||"#888"}
function sizeCanvas(c){const dpr=window.devicePixelRatio||1;const w=c.clientWidth||300,h=c.clientHeight||170;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);const g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);return{g,w,h}}
function projector(pts,w,h,pad){
  let a=Infinity,b=-Infinity,c=Infinity,d=-Infinity;for(const p of pts){a=Math.min(a,p[0]);b=Math.max(b,p[0]);c=Math.min(c,p[1]);d=Math.max(d,p[1])}

  const ox=(w-sw*sc)/2,oy=(h-sh*sc)/2;return p=>[ox+(p[1]-c)*k*sc,h-oy-(p[0]-a)*sc];
}
// A jump with no GPS in between (the phone locked, or signal dropped) is drawn dashed, not as road.

function strokePath(g,P,arr,col,wd){if(arr.length<2)return;g.strokeStyle=col;g.lineWidth=wd;g.lineJoin="round";g.lineCap="round";g.beginPath();const gaps=[];
  arr.forEach((p,i)=>{const[x,y]=P(p);if(i&&isGap(arr[i-1],p)){gaps.push([arr[i-1],p]);g.moveTo(x,y)}else i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();

function drawRoute(c,pts,opt={}){
  const {g,w,h}=sizeCanvas(c);g.clearRect(0,0,w,h);
  if(opt.bg){g.fillStyle=opt.bg;g.fillRect(0,0,w,h)}
  else{g.strokeStyle=css("--grid");g.lineWidth=1;
    for(let x=0;x<w;x+=24){g.beginPath();g.moveTo(x+.5,0);g.lineTo(x+.5,h);g.stroke()}
    for(let y=0;y<h;y+=24){g.beginPath();g.moveTo(0,y+.5);g.lineTo(w,y+.5);g.stroke()}}
  const ctx=opt.context||(opt.guide?[...opt.guide,...pts]:pts);if(!ctx.length)return;
  const P=projector(ctx,w,h,18);

  if(opt.hl)strokePath(g,P,pts.slice(opt.hl[0],opt.hl[1]+1),css("--hl"),opt.thin?3.5:5);
  const dot=(p,col)=>{const[x,y]=P(p);g.fillStyle=css("--surface");g.beginPath();g.arc(x,y,6,0,7);g.fill();g.fillStyle=col;g.beginPath();g.arc(x,y,4,0,7);g.fill()};

  if(opt.live&&pts.length){const[x,y]=P(pts[pts.length-1]);g.fillStyle=css("--accent");g.beginPath();g.arc(x,y,7,0,7);g.fill()}
}

/* ================= data sources ================= */
const NUS="6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const SOURCES={
  phone:{name:"Phone GPS",note:"Built-in GPS and motion sensors, about 1 Hz"},
  racebox:{name:"RaceBox",note:"Mini, Mini S or Micro over Bluetooth, up to 25 Hz",ble:{filters:[{namePrefix:"RaceBox"}],optionalServices:[NUS]}},
  dragy:{name:"Dragy",note:"Over Bluetooth, 10 Hz. Experimental",ble:{filters:[{namePrefix:"Dragy"},{namePrefix:"DRAGY"}],optionalServices:[NUS,"0000ffe0-0000-1000-8000-00805f9b34fb","0000fff0-0000-1000-8000-00805f9b34fb","00001819-0000-1000-8000-00805f9b34fb"]}},
  nmea:{name:"Other Bluetooth GPS",note:"Any receiver that streams NMEA",ble:{acceptAllDevices:true,optionalServices:[NUS,"0000ffe0-0000-1000-8000-00805f9b34fb","0000fff0-0000-1000-8000-00805f9b34fb"]}}};
const DEV={device:null,name:"",status:"",battery:null,sats:null,hz:0,_n:0,_t:0,last:null};
const hasBLE=!!(navigator.bluetooth&&navigator.bluetooth.requestDevice);

// RaceBox "Data Message": UBX-framed, class 0xFF id 0x01, 80-byte payload (RaceBox BLE protocol)
function makeUbxParser(onFix){
  let buf=new Uint8Array(0);
  return chunk=>{
    const nb=new Uint8Array(buf.length+chunk.length);nb.set(buf);nb.set(chunk,buf.length);buf=nb;
    let i=0;
    while(buf.length-i>=8){
      if(buf[i]!==0xB5||buf[i+1]!==0x62){i++;continue}
      const len=buf[i+4]|(buf[i+5]<<8),total=8+len;if(buf.length-i<total)break;
      let a=0,b=0;for(let k=i+2;k<i+6+len;k++){a=(a+buf[k])&255;b=(b+a)&255}
      if(a===buf[i+6+len]&&b===buf[i+7+len]&&buf[i+2]===0xFF&&buf[i+3]===0x01&&len===80){
        const v=new DataView(buf.buffer,buf.byteOffset+i+6,80);
        const fix=v.getUint8(20),valid=v.getUint8(21)&1;
        DEV.sats=v.getUint8(23);DEV.battery=v.getUint8(67)&0x7F;
        if(fix>=2&&valid){
          const t=Date.UTC(v.getUint16(4,true),v.getUint8(6)-1,v.getUint8(7),v.getUint8(8),v.getUint8(9),v.getUint8(10))+Math.round(v.getInt32(16,true)/1e6);
          const gx=v.getInt16(68,true)/1000,gy=v.getInt16(70,true)/1000;
          onFix({lat:v.getInt32(28,true)/1e7,lon:v.getInt32(24,true)/1e7,t,v:Math.max(0,v.getInt32(48,true)/1000),alt:v.getInt32(36,true)/1000,acc:v.getUint32(40,true)/1000,gLong:gx,gLat:gy,gTot:Math.hypot(gx,gy)});
        }else onFix(null);
      }
      i+=total;
    }
    buf=buf.slice(i);
  };
}
// Standard NMEA 0183: RMC gives position/speed/time, GGA gives altitude and satellites
function makeNmeaParser(onFix){
  let text="",alt=null;const dec=new TextDecoder();
  const coord=(s,h)=>{if(!s)return NaN;const dot=s.indexOf(".");const deg=+s.slice(0,dot-2),min=+s.slice(dot-2);const v=deg+min/60;return h==="S"||h==="W"?-v:v};
  return chunk=>{
    text+=dec.decode(chunk,{stream:true});const lines=text.split(/\r?\n/);text=lines.pop();
    for(const line of lines){
      const m=line.match(/\$(..)(RMC|GGA),([^*]*)\*([0-9A-F]{2})/i);if(!m)continue;
      let cs=0;const body=line.slice(line.indexOf("$")+1,line.indexOf("*"));for(const ch of body)cs^=ch.charCodeAt(0);
      if(cs!==parseInt(m[4],16))continue;
      const f=m[3].split(",");
      if(m[2]==="GGA"){alt=f[8]?+f[8]:null;DEV.sats=+f[6]||DEV.sats;continue}
      if(f[1]!=="A"){onFix(null);continue}
      const tm=f[0],dt=f[8];
      const t=Date.UTC(2000+ +dt.slice(4,6),+dt.slice(2,4)-1,+dt.slice(0,2),+tm.slice(0,2),+tm.slice(2,4),0)+Math.round(parseFloat(tm.slice(4))*1000);
      onFix({lat:coord(f[2],f[3]),lon:coord(f[4],f[5]),t,v:(+f[6]||0)*0.514444,alt,acc:null,gLong:null,gLat:null,gTot:null});
    }
  };
}
async function connectDevice(kind){
  const src=SOURCES[kind];
  if(!hasBLE){toast("This browser can't use Bluetooth. Try Chrome on Android or a computer.");return}
  try{
    DEV.status="Choose your device…";updateDevice();
    const device=await navigator.bluetooth.requestDevice(src.ble);
    DEV.device=device;DEV.name=device.name||src.name;DEV.status="Connecting…";updateDevice();
    device.addEventListener("gattserverdisconnected",()=>{DEV.status="Disconnected";DEV.hz=0;updateDevice();if(REC.on&&S.settings.source===kind)setGps("off","Device disconnected. Recording paused until it reconnects.")});
    const server=await device.gatt.connect();
    const services=await server.getPrimaryServices();
    const onFix=fix=>{
      const now=performance.now();DEV._n++;if(now-DEV._t>1000){DEV.hz=Math.round(DEV._n*1000/(now-DEV._t));DEV._n=0;DEV._t=now}
      DEV.last=fix;DEV.status=fix?"Connected · GPS fix":"Connected · waiting for GPS fix";
      if(fix&&REC.on&&S.settings.source===kind)ingest(fix);
      throttle(updateDevice,500);
    };
    const ubx=makeUbxParser(onFix),nmea=makeNmeaParser(onFix);let subscribed=0;
    for(const s of services){let chars=[];try{chars=await s.getCharacteristics()}catch(e){}
      for(const ch of chars){if(!ch.properties.notify)continue;
        ch.addEventListener("characteristicvaluechanged",e=>{const u=new Uint8Array(e.target.value.buffer.slice(e.target.value.byteOffset,e.target.value.byteOffset+e.target.value.byteLength));if(u[0]===0xB5||kind==="racebox")ubx(u);else nmea(u)});
        try{await ch.startNotifications();subscribed++}catch(e){}}}
    DEV.status=subscribed?"Connected · waiting for data":"Connected, but the device sent nothing we can read";updateDevice();
  }catch(e){DEV.status=e&&e.name==="NotFoundError"?"No device chosen":"Couldn't connect: "+(e&&e.message||e);updateDevice()}
}
let thr={};function throttle(fn,ms){if(thr[fn.name])return;thr[fn.name]=setTimeout(()=>{thr[fn.name]=0;fn()},ms)}
function updateDevice(){const el=$("#dev-status");if(!el)return;
  el.innerHTML=DEV.device||DEV.status?`<span class="dot ${DEV.last?"ok":DEV.device&&DEV.device.gatt&&DEV.device.gatt.connected?"wait":"off"}"></span><div style="flex:1;min-width:0"><div style="font-weight:600">${esc(DEV.name||"No device")}</div><div class="muted small">${esc(DEV.status)}</div></div>${DEV.hz?`<span class="chip">${DEV.hz} Hz</span>`:""}${DEV.sats!=null?`<span class="chip">${DEV.sats} sats</span>`:""}${DEV.battery!=null?`<span class="chip">${DEV.battery}% battery</span>`:""}`:`<span class="dot"></span><span class="muted small">No device connected</span>`}

// Phone motion sensors: horizontal g (gravity removed), peak between GPS fixes
const MOT={on:false,peak:0,handler:null};
async function startMotion(){
  if(!S.settings.motion||MOT.on||typeof DeviceMotionEvent==="undefined")return;
  try{if(typeof DeviceMotionEvent.requestPermission==="function"){const r=await DeviceMotionEvent.requestPermission();if(r!=="granted")return}}catch(e){return}
  MOT.handler=e=>{const a=e.acceleration,ai=e.accelerationIncludingGravity;if(!a||!ai||a.x==null||ai.x==null)return;
    const gx=ai.x-a.x,gy=ai.y-a.y,gz=ai.z-a.z,gn=Math.hypot(gx,gy,gz)||1;
    const dot=(a.x*gx+a.y*gy+a.z*gz)/gn;const hx=a.x-dot*gx/gn,hy=a.y-dot*gy/gn,hz=a.z-dot*gz/gn;
    const g=Math.hypot(hx,hy,hz)/G;if(g<3)MOT.peak=Math.max(MOT.peak,g)};
  window.addEventListener("devicemotion",MOT.handler);MOT.on=true;
}
function stopMotion(){if(MOT.handler)window.removeEventListener("devicemotion",MOT.handler);MOT.on=false;MOT.handler=null;MOT.peak=0}

// GoPro telemetry (GPMF) reader: finds the metadata track in a GoPro MP4 and pulls out GPS.
// Reads only the parts of the file it needs, so multi-GB clips are fine.
async function goproTrack(file){
  const rd=async(o,n)=>new DataView(await file.slice(o,o+n).arrayBuffer());
  const str=(dv,o,n)=>{let s="";for(let i=0;i<n;i++)s+=String.fromCharCode(dv.getUint8(o+i));return s};

  while(off+8<=size){const h=await rd(off,16);let sz=h.getUint32(0);const ty=str(h,4,4);let hl=8;
    if(sz===1){sz=Number(h.getBigUint64(8));hl=16}else if(sz===0)sz=size-off;
    if(ty==="moov"){moov={o:off+hl,n:sz-hl};break}if(sz<8)break;off+=sz}
  if(!moov)return null;
  const mv=await rd(moov.o,moov.n);
  function kids(o,end){const out=[];while(o+8<=end){let sz=mv.getUint32(o);const ty=str(mv,o+4,4);let hl=8;if(sz===1){sz=Number(mv.getBigUint64(o+8));hl=16}else if(sz===0)sz=end-o;if(sz<8)break;out.push({ty,o:o+hl,end:o+sz});o+=sz}return out}
  const find=(list,ty)=>list.find(b=>b.ty===ty);
  let meta=null;
  for(const t of kids(0,mv.byteLength).filter(b=>b.ty==="trak")){
    const mdia=find(kids(t.o,t.end),"mdia");if(!mdia)continue;const mk=kids(mdia.o,mdia.end);
    const minf=find(mk,"minf");if(!minf)continue;const stbl=find(kids(minf.o,minf.end),"stbl");if(!stbl)continue;const sk=kids(stbl.o,stbl.end);
    const stsd=find(sk,"stsd");if(!stsd||str(mv,stsd.o+12,4)!=="gpmd")continue;
    const mdhd=find(mk,"mdhd");const v=mv.getUint8(mdhd.o);const timescale=mv.getUint32(mdhd.o+(v===1?20:12));
    meta={timescale,sk};break}
  if(!meta)return null;
  const {sk,timescale}=meta;const B=t=>find(sk,t);
  // sample sizes
  const stsz=B("stsz");const fixed=mv.getUint32(stsz.o+4),count=mv.getUint32(stsz.o+8);const sizes=[];for(let i=0;i<count;i++)sizes.push(fixed||mv.getUint32(stsz.o+12+i*4));

  const co=B("stco")||B("co64");const nch=mv.getUint32(co.o+4);const chunks=[];for(let i=0;i<nch;i++)chunks.push(co.ty==="co64"?Number(mv.getBigUint64(co.o+8+i*8)):mv.getUint32(co.o+8+i*4));

  const offs=[];let si=0;for(let c=0;c<nch&&si<count;c++){let per=0;for(const r of runs)if(r[0]<=c+1)per=r[1];let o=chunks[c];for(let k=0;k<per&&si<count;k++){offs.push(o);o+=sizes[si++]}}
  // sample times
  const stts=B("stts");const ne=mv.getUint32(stts.o+4);const times=[];let tt=0;for(let i=0;i<ne;i++){const n=mv.getUint32(stts.o+8+i*8),d=mv.getUint32(stts.o+12+i*8);for(let k=0;k<n;k++){times.push([tt/timescale,d/timescale]);tt+=d}}

  for(let i=0;i<offs.length;i++){
    const dv=await rd(offs[i],sizes[i]);const[t0,dur]=times[i]||[i,1];
    const got=parseGpmf(dv,str);if(got.model)model=got.model;
    for(const g of got.gps){const n=g.rows.length;
      for(let k=0;k<n;k++){const r=g.rows[k];let utc=null;
        if(g.gps9){utc=Date.UTC(2000,0,1)+r.days*864e5+r.secs*1000}

  const base=anchor?anchor.utc-anchor.vt*1000:null;
  return{model,start:base,pts:pts.map(p=>({...p,t:base!=null?Math.round(base+p.vt*1000):null}))};
}
function parseGpmf(dv,str){

  function walk(o,end,ctx){
    while(o+8<=end){const key=str(dv,o,4),type=String.fromCharCode(dv.getUint8(o+4)),ss=dv.getUint8(o+5),rep=dv.getUint16(o+6);const len=ss*rep,d=o+8,next=d+((len+3)&~3);
      if(key==="\0\0\0\0")break;
      if(dv.getUint8(o+4)===0){walk(d,Math.min(d+len,end),key==="STRM"?{scal:null,type:null,utc:null,fix:3,dop:null}:ctx)}
      else if(key==="DVNM"||key==="MINF"){if(!out.model)out.model=str(dv,d,len).replace(/\0+$/,"")}
      else if(ctx&&key==="SCAL"){const n=SZ[type]||4;ctx.scal=[];for(let i=0;i<len/n;i++)ctx.scal.push(num(type,d+i*n))}
      else if(ctx&&key==="TYPE"){ctx.type=str(dv,d,len).replace(/\0+$/,"")}
      else if(ctx&&key==="GPSU"){const s=str(dv,d,16);const m=s.match(/^(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)\.(\d+)/);if(m)ctx.utc=Date.UTC(2000+ +m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6],+m[7].padEnd(3,"0").slice(0,3))}
      else if(ctx&&key==="GPSF"){ctx.fix=num(type,d)}
      else if(ctx&&key==="GPSP"){ctx.dop=num(type,d)/100}
      else if(ctx&&(key==="GPS5"||key==="GPS9")){
        const gps9=key==="GPS9";const types=gps9?(type==="?"&&ctx.type?ctx.type:"lllllllSS"):"lllll";const sc=ctx.scal||[1];const rows=[];
        for(let r=0;r<rep;r++){let p=d+r*ss;const v=[];for(let f=0;f<types.length;f++){const t=types[f];v.push(num(t,p)/(sc[f]!=null?sc[f]:sc[0]));p+=SZ[t]}
          const row={lat:v[0],lon:v[1],alt:v[2],s2:v[3],s3:v[4],dop:ctx.dop};
          if(gps9){row.days=v[5];row.secs=v[6];row.dop=v[7];row.fix=Math.round(v[8])}rows.push(row)}
        out.gps.push({gps9,rows,utc:ctx.utc,fix:ctx.fix})}
      o=next}
  }
  function num(t,o){switch(t){case"b":return dv.getInt8(o);case"B":return dv.getUint8(o);case"s":return dv.getInt16(o);case"S":return dv.getUint16(o);case"l":return dv.getInt32(o);case"L":return dv.getUint32(o);case"f":return dv.getFloat32(o);case"d":return dv.getFloat64(o);case"j":return Number(dv.getBigInt64(o));case"J":return Number(dv.getBigUint64(o));default:return dv.getInt32(o)}}
  walk(0,dv.byteLength,null);return out;
}
// Turn one or more GoPro clips (a long recording is split into several files) into a drive.
async function importGoPro(files){
  toast("Reading GPS from your GoPro video…");let tracks=[];

async function downscale(file,max){

function exportGpx(d){

  const xml=`<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="Dragon Drive" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>${esc(d.title)}</name><trkseg>${pts}</trkseg></trk></gpx>`;
  saveFile(new Blob([xml],{type:"application/gpx+xml"}),d.title.replace(/[^\w]+/g,"-")+".gpx");
}

}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function fitText(g,t,x,y,maxW,size,font){let s=size;while(s>36){g.font=`700 ${s}px ${font}`;if(g.measureText(t).width<=maxW)break;s-=4}let txt=t;while(g.measureText(txt).width>maxW&&txt.length>4)txt=txt.slice(0,-2);g.fillText(txt===t?t:txt+"…",x,y)}
async function saveFile(blob,name){
  try{const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(dl){await dl.save({filename:name,data:blob});toast("Saved");return}}catch(e){if(e&&e.code==="declined")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function openShare(id,back){
  const d=findDrive(id);if(!d)return;
  const sh=$("#sheet");const wasOpen=back!=null?back:(!sh.hidden&&SHEET&&SHEET.kind==="drive");
  if(DETAIL_MAP){DETAIL_MAP.remove();DETAIL_MAP=null}SHEET={kind:"share",id,back:wasOpen};
  sh.innerHTML=`<div class="sheet-bar"><div class="wrap"><button class="btn ghost" id="sh-x" type="button">← Back</button><span class="spacer"></span><h3>Share card</h3></div></div>
    <div class="wrap body stack">${stylePicker()}<div class="empty" id="card-wait">Building your card…</div><img class="share-preview" id="card-img" alt="Share card for ${esc(d.title)}" hidden>
    <div class="row" style="justify-content:center"><button class="btn primary" id="card-share" type="button" hidden>Share</button><button class="btn" id="card-save" type="button" disabled>Save image</button>${d.who==="me"&&!d.photo?`<button class="btn ghost" id="card-photo" type="button">Add a photo first</button>`:""}</div>
    <p class="muted small" style="text-align:center;margin:0">1080 × 1350, sized for Instagram, stories and group chats.</p></div>`;
  sh.hidden=false;sh.scrollTop=0;document.body.style.overflow="hidden";
  $("#sh-x").onclick=()=>wasOpen?openDrive(d.id):closeSheet();
  const tok=openShare._tok=(openShare._tok||0)+1;
  const ph=$("#card-photo");if(ph)ph.onclick=()=>{const inp=$("#photo-in");inp.value="";inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;try{await photos.put(d.id,await downscale(f,1600));d.photo=true;save();openShare(d.id,wasOpen)}catch(e){toast("That file couldn't be read as a photo.")}};inp.click()};
  const c=await buildCard(d);if(tok!==openShare._tok)return;
  const blob=await new Promise(r=>c.toBlob(r,"image/png"));
  const img=$("#card-img");if(!img)return;img.src=URL.createObjectURL(blob);img.hidden=false;$("#card-wait").hidden=true;
  const name=(d.title.replace(/[^\w]+/g,"-")||"drive")+".png";
  const file=typeof File!=="undefined"?new File([blob],name,{type:"image/png"}):null;
  const sb=$("#card-share");
  if(file&&navigator.canShare&&(()=>{try{return navigator.canShare({files:[file]})}catch(e){return false}})()){sb.hidden=false;sb.onclick=async()=>{try{await shareSheet({files:[file]})}catch(e){}}}
  const sv=$("#card-save");sv.disabled=false;sv.onclick=()=>saveFile(blob,name);
}

/* ================= overlay video ================= */
// Pick a clip filmed during the drive, line it up with the GPS timeline, and burn in live data.
// Widget looks (ring, needle and digital speed, compass, elevation, Retro HUD) come from syntaxless/video-overlay.
// Export re-encodes frame by frame with Mediabunny (vendor/mediabunny, MPL-2.0) where the browser has WebCodecs,
// so it runs faster than real time and keeps audio; otherwise it records the preview in real time with MediaRecorder.
const OV_THEMES=[["dd","Dragon Drive"],["retro","Retro HUD"]];
const OV_SPEEDS=[["bar","Bar"],["ring","Ring"],["needle","Needle"],["digital","Digital"]];
const OV_WIDGETS=[["speed","Speed"],["g","G-force"],["map","Route map"],["elev","Elevation"],["compass","Compass"],["runs","Timed runs"],["title","Title & time"]];
function ovStyle(){const o=S.settings.overlay||{};return{theme:o.theme==="retro"?"retro":"dd",speed:OV_SPEEDS.some(s=>s[0]===o.speed)?o.speed:"bar",hide:Array.isArray(o.hide)?o.hide:[]}}
function setOv(k,v){S.settings.overlay={...ovStyle(),[k]:v};save()}
function telemetry(d){
  const P=d.pts,n=P.length,t0=P[0][2];const T=P.map(p=>(p[2]-t0)/1000);
  // g per point: sensor values when recorded, otherwise estimated from speed change and heading change
  const G=P.map((p,i)=>{if(p[5]!=null&&p[6]!=null)return[p[5],p[6]];const a=P[Math.max(0,i-1)],b=P[Math.min(n-1,i+1)];const dt=(b[2]-a[2])/1000||1;
    const lon=(b[3]-a[3])/dt/9.81;let lat=0;if(i>0&&i<n-1){const h1=Math.atan2(p[1]-a[1],p[0]-a[0]),h2=Math.atan2(b[1]-p[1],b[0]-p[0]);let dh=h2-h1;while(dh>Math.PI)dh-=2*Math.PI;while(dh<-Math.PI)dh+=2*Math.PI;lat=p[3]*dh/dt/9.81}
    return[Math.max(-1.6,Math.min(1.6,lon)),Math.max(-1.6,Math.min(1.6,lat))]});
  // heading per point: bearing to the first point at least 10 m ahead, held while stopped so it doesn't spin
  const Hd=new Array(n).fill(null);let j=0,last=null;
  for(let i=0;i<n;i++){if(j<i)j=i;while(j<n-1&&hav(P[i],P[j])<10)j++;
    if(P[i][3]>1&&hav(P[i],P[j])>=10){const k=Math.cos(rad(P[i][0]));last=(Math.atan2((P[j][1]-P[i][1])*k,P[j][0]-P[i][0])*180/Math.PI+360)%360}Hd[i]=last}
  for(let i=n-2;i>=0;i--)if(Hd[i]==null)Hd[i]=Hd[i+1];
  // elevation profile, at most 600 points
  const E=[];P.forEach((p,i)=>{if(p[4]!=null)E.push([T[i],p[4]])});const step=Math.max(1,Math.ceil(E.length/600));
  const prof=E.length>1?E.filter((e,i)=>i%step===0||i===E.length-1):null;
  const elev=prof&&{pts:prof,min:Math.min(...prof.map(e=>e[1])),max:Math.max(...prof.map(e=>e[1]))};
  const runs=[];for(const r of RUN_DEFS){const v=d.stats.runs&&d.stats.runs[r.k];if(v)for(const a of (v.all||[v]))runs.push({label:r.label,at:a.at,t:a.t,best:a.t===v.t})}
  return{d,T,G,runs,elev,dur:T[n-1],
    at(t){t=Math.max(0,Math.min(T[n-1],t));let lo=0,hi=n-1;while(hi-lo>1){const m=(lo+hi)>>1;if(T[m]<=t)lo=m;else hi=m}
      const f=T[hi]>T[lo]?(t-T[lo])/(T[hi]-T[lo]):0,L=(a,b)=>a+(b-a)*f,A=P[lo],B=P[hi];
      let hd=Hd[lo];if(hd!=null&&Hd[hi]!=null){let dh=Hd[hi]-hd;if(dh>180)dh-=360;if(dh<-180)dh+=360;hd=(hd+dh*f+360)%360}
      const alt=A[4]!=null&&B[4]!=null?L(A[4],B[4]):A[4]!=null?A[4]:B[4];
      return{i:lo,f,lat:L(A[0],B[0]),lon:L(A[1],B[1]),v:L(A[3],B[3]),alt,hd,gx:L(G[lo][1],G[hi][1]),gy:L(G[lo][0],G[hi][0])}}};
}
const OV_F='"Barlow Condensed","Arial Narrow",sans-serif';
const OV_BLUE="#0a84ff",OV_PANEL="rgba(10,14,13,.55)";
const COMPASS_PTS=["N","NE","E","SE","S","SW","W","NW"];
const compassPoint=deg=>COMPASS_PTS[Math.round((((deg%360)+360)%360)/45)%8];
// Everything the widgets need for frame time t (seconds since the drive started).
function ovFrame(W,H,tl,t,box,st){
  const u=Math.min(W,H)/1080,k=tl.at(t),inDrive=t>=0&&t<=tl.dur,on=w=>!st.hide.includes(w);
  const top=fSpeed(tl.d.stats.max||0);
  return{W,H,u,k,t,inDrive,on,tl,box,st,
    sp:inDrive?fSpeed(k.v):0,top:Math.max(1,top),dialMax:Math.max(60,Math.ceil(top*1.1/20)*20),
    gx:inDrive?k.gx:0,gy:inDrive?k.gy:0,hd:inDrive?k.hd:null,alt:inDrive?k.alt:null,el:Math.max(0,Math.min(tl.dur,t))};
}
const fmtElapsed=el=>`${Math.floor(el/60)}:${String(Math.floor(el%60)).padStart(2,"0")}.${Math.floor(el*10%10)}`;
// Which timed run to show: one that just finished, else one in progress.
function ovRun(tl,t){const cand=tl.runs.filter(r=>t>=r.at&&t<=r.at+r.t+4),fin=cand.filter(r=>t>=r.at+r.t&&t<=r.at+r.t+2.5).sort((a,b)=>(b.at+b.t)-(a.at+a.t)),liv=cand.filter(r=>t<r.at+r.t).sort((a,b)=>b.t-a.t);
  return fin[0]||liv[0]||cand.sort((a,b)=>(b.at+b.t)-(a.at+a.t))[0]}
// Corners: speed bottom left, g-force bottom right, map top right, title + compass top left, runs top centre.
// Elevation sits left of the g-force box, or above it when the frame is too narrow (portrait clips).
function ovLayout(f,speedW){
  const{W,H,u,on}=f,m=36*u,gS=220*u,eW=380*u,eH=150*u;
  const g={x:W-m-gS,y:H-m-gS,w:gS,h:gS};
  let e={x:on("g")?g.x-20*u-eW:W-m-eW,y:H-m-eH,w:eW,h:eH};
  if(on("speed")&&e.x<m+speedW+20*u)e={x:W-m-eW,y:on("g")?g.y-20*u-eH:H-m-eH,w:eW,h:eH};
  return{m,g,e};

function drawOverlay(g,W,H,tl,t,box,st){
  st=st||ovStyle();const f=ovFrame(W,H,tl,t,box,st);
  g.save();g.textBaseline="alphabetic";g.textAlign="left";
  if(st.theme==="retro")drawRetro(g,f);else drawStandard(g,f);
  g.restore();
}

/* ---- Dragon Drive look ---- */

    g.strokeStyle="rgba(255,255,255,.25)";g.lineWidth=2*u;for(const r of [.5,1]){g.beginPath();g.arc(cx,cy,R*r/1.2,0,7);g.stroke()}

    g.fillStyle="#fff";g.font=`700 ${34*u}px ${F}`;g.textAlign="center";g.fillText(gm.toFixed(2)+" g",cx,cy+R+8*u);g.textAlign="left"}

    g.font=`700 ${44*u}px "UnifrakturCook",serif`;g.fillText("Dragon Drive",40*u,78*u);

/* ================= cruises ================= */
// Drives by different people that cover the same roads at the same time become a cruise.
// Only drives you can already see are compared, so grouping never reveals anything new.
const CRUISE_COLORS=["#0a84ff","#ff7a45","#3fbf8a","#bf5af2","#ffd60a","#ff375f","#64d2ff"];
function posAt(pts,t){if(!pts.length||t<pts[0][2]||t>pts[pts.length-1][2])return null;let lo=0,hi=pts.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(pts[m][2]<=t)lo=m;else hi=m}
  const a=pts[lo],b=pts[hi],f=b[2]>a[2]?(t-a[2])/(b[2]-a[2]):0;return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]}
function droveTogether(a,b){
  if(a.who===b.who||a.pts.length<2||b.pts.length<2)return false;
  const t0=Math.max(a.pts[0][2],b.pts[0][2]),t1=Math.min(a.pts[a.pts.length-1][2],b.pts[b.pts.length-1][2]);if(t1-t0<120e3)return false;
  let n=0,hit=0;for(let t=t0;t<=t1;t+=15e3){const p=posAt(a.pts,t),q=posAt(b.pts,t);if(!p||!q)continue;n++;if(hav(p,q)<600)hit++}
  return n>=8&&hit/n>=.6;
}
let CRUISE_CACHE={key:"",groups:[]};
function cruises(drives){
  const key=drives.map(d=>d.id+":"+d.pts.length).sort().join("|");if(key===CRUISE_CACHE.key)return CRUISE_CACHE.groups;
  const ds=drives.filter(d=>d.pts.length>1).sort((a,b)=>a.start-b.start),parent=new Map(ds.map(d=>[d.id,d.id]));
  const find=x=>{while(parent.get(x)!==x){parent.set(x,parent.get(parent.get(x)));x=parent.get(x)}return x};
  for(let i=0;i<ds.length;i++)for(let j=i+1;j<ds.length;j++){if(ds[j].start>ds[i].pts[ds[i].pts.length-1][2])break;if(droveTogether(ds[i],ds[j]))parent.set(find(ds[j].id),find(ds[i].id))}
  const by=new Map();for(const d of ds){const r=find(d.id);if(!by.has(r))by.set(r,[]);by.get(r).push(d)}
  const groups=[...by.values()].filter(g=>new Set(g.map(d=>d.who)).size>1).map(g=>({id:"c-"+g[0].id,drives:g,start:g[0].start}));
  CRUISE_CACHE={key,groups};return groups;
}

// Group drives by area so a trip across the state doesn't shrink local roads to a dot.
function areas(drives){
  const out=[];
  for(const d of drives){if(d.pts.length<2)continue;const c=d.pts[Math.floor(d.pts.length/2)];
    let a=out.find(x=>hav(x.center,c)<25000);if(!a){a={center:c,drives:[]};out.push(a)}a.drives.push(d)}
  return out.sort((x,y)=>y.drives.length-x.drives.length);
}
function drawHeat(c,drives){
  const k=backdrop(),ink=routeInk(k);
  if(BACKDROPS[k].map){const all=[].concat(...drives.map(d=>d.pts));const {g,w,h}=sizeCanvas(c);g.fillStyle=css("--surface-2");g.fillRect(0,0,w,h);
    const tok=c._tok=(c._tok||0)+1;const ratio=window.devicePixelRatio||1;
    snapshot(k,w,h,ratio,all,24,(g2,P)=>{g2.globalAlpha=Math.max(.3,Math.min(.85,1.8/drives.length));for(const d of drives)strokePath(g2,P,d.pts,ink.route,3.5);g2.globalAlpha=1})
      .then(img=>{if(c._tok!==tok||!c.isConnected)return;const g3=c.getContext("2d");g3.setTransform(1,0,0,1,0,0);g3.drawImage(img,0,0,c.width,c.height)}).catch(()=>{});
    return}
  const {g,w,h}=sizeCanvas(c);g.clearRect(0,0,w,h);
  if(k==="solid"){g.fillStyle=ink.bg;g.fillRect(0,0,w,h)}else{
  g.strokeStyle=css("--grid");g.lineWidth=1;
  for(let x=0;x<w;x+=24){g.beginPath();g.moveTo(x+.5,0);g.lineTo(x+.5,h);g.stroke()}
  for(let y=0;y<h;y+=24){g.beginPath();g.moveTo(0,y+.5);g.lineTo(w,y+.5);g.stroke()}}
  const all=[].concat(...drives.map(d=>d.pts));if(!all.length)return;
  const P=projector(all,w,h,18);
  g.globalAlpha=Math.max(.25,Math.min(.8,1.6/drives.length));
  for(const d of drives)strokePath(g,P,d.pts,ink.route,4);
  g.globalAlpha=1;
}

function routeRow(d){const p=person(d.who);return `<button class="effort open-link" data-open="${d.id}" style="display:flex">${p.handle&&d.who!=="me"?`<span data-user="${esc(p.handle)}" class="user-link">${avatar(p,30)}</span>`:avatar(p,30)}<div style="flex:1;min-width:0"><div style="font-weight:600">${esc(d.title)}</div><div class="muted small">${d.who!=="me"?(p.handle?`<span data-user="${esc(p.handle)}">${nameHtml(p)}</span>`:esc(p.name))+" · ":""}${ago(d.start)} · ${fDist(d.stats.dist).toFixed(1)} ${dLabel()}</div></div>${d.sample?'<span class="chip example">Example</span>':""}</button>`}

    try{const r=await Social.search($("#f-in").value);box.innerHTML=r.length?r.map(p=>{const pp=Social.person("u:"+p.id);return `<a class="effort" href="#u/${esc(p.handle)}" style="display:flex;text-decoration:none;color:inherit">${avatar(pp,32)}<div style="flex:1;min-width:0"><div style="font-weight:600">${nameHtml(pp)}</div><div class="muted small">@${esc(p.handle)}${Social.SOC.following.has(p.id)?" · Following":""}</div></div></a>`}).join(""):'<p class="muted small" style="margin:0">Nobody by that handle yet.</p>'}catch(err){box.innerHTML='<p class="muted small" style="margin:0">Search failed. Check your connection.</p>'}};
  const dvs=$("#def-vis");if(dvs)dvs.onchange=e=>{S.settings.defaultVis=e.target.value;save();toast("Saved")};
  const he=$("#hide-ends");if(he)he.onchange=e=>{S.settings.hideEnds=e.target.checked;save()};
}

/* ================= global events ================= */
document.addEventListener("click",e=>{
  const br=e.target.closest("#brand");if(br){replay(br,"flare",950);if(location.hash==="#feed"||location.hash===""){e.preventDefault();if(!$("#sheet").hidden)closeSheet();else window.scrollTo({top:0,behavior:"smooth"})}return}

document.addEventListener("change",e=>{if(e.target.id==="solid-color"){S.settings.solidColor=e.target.value;save();rerender()}});
// Re-draw after a setting change without losing the reader's place.
function rerender(){const sh=$("#sheet");
  if(SHEET&&!sh.hidden){if(SHEET.kind==="video")return;const y=sh.scrollTop;if(SHEET.kind==="cruise"){openCruise(SHEET.id);sh.scrollTop=y;return}if(SHEET.kind==="vehicle"){openVehicle(SHEET.spec);sh.scrollTop=y;return}if(SHEET.kind==="post"){openPost(SHEET.id);sh.scrollTop=y;return}if(SHEET.kind==="planner")return;if(SHEET.kind==="route"){openRoute(SHEET.id);sh.scrollTop=y;return}if(SHEET.kind==="share")openShare(SHEET.id,SHEET.back);else openDrive(SHEET.id);sh.scrollTop=y}
  else{const y=window.scrollY;render();window.scrollTo(0,y)}}
function onHash(){const sh=$("#sheet");if(!sh.hidden){if(DETAIL_MAP){DETAIL_MAP.remove();DETAIL_MAP=null}SHEET=null;sh.hidden=true;sh.classList.remove("sheet-out");document.body.style.overflow=""}render();if(pendingOpen){const id=pendingOpen;pendingOpen=null;openDrive(id,true)}}
// Switching tabs slides the page in tab order. Browsers without View Transitions get a quick fade-up instead.
const TAB_IDX={feed:0,record:1,routes:2,you:3,profile:4};
window.addEventListener("hashchange",()=>{
  const to=(location.hash||"#feed").slice(1),toI=to.startsWith("u/")?4:TAB_IDX[to]!=null?TAB_IDX[to]:0,fromI=TAB_IDX[current]!=null?TAB_IDX[current]:0;
  if(reducedMotion()||REC.on||pendingOpen){onHash();return}
  if(document.startViewTransition){const html=document.documentElement;html.dataset.vt=toI<fromI?"back":"fwd";
    try{const t=document.startViewTransition(onHash);t.finished.finally(()=>{delete html.dataset.vt});return}catch(e){delete html.dataset.vt}}
  onHash();replay($("#view"),"view-in",300)});
// Any sheet that opens gets the push-in animation; re-drawing an open sheet doesn't replay it.
(()=>{const sh=$("#sheet");let shown=!sh.hidden;new MutationObserver(()=>{if(shown===!sh.hidden)return;shown=!sh.hidden;if(shown){sh.classList.remove("sheet-out");replay(sh,"sheet-in",350)}}).observe(sh,{attributes:true,attributeFilter:["hidden"]})})();
let rz,lastW=window.innerWidth;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(window.innerWidth===lastW)return;lastW=window.innerWidth;if($("#sheet").hidden)render()},200)});
const authHash=/access_token=|error_description=/.test(location.hash)?location.hash:null;if(authHash)history.replaceState(null,"",location.pathname+"#you");
render();loadAvatar();
// iOS Home Screen apps can leave the fixed tab bar floating mid-screen after the share sheet
// (or a keyboard it opened) closes, until the page is scrolled. Nudge the layout to re-seat it.
function reseat(){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  const y=window.scrollY,nav=document.querySelector("nav.tabs");window.scrollTo(window.scrollX,y+1);window.scrollTo(window.scrollX,y);
  if(nav){nav.style.transform="translateZ(0)";void nav.offsetHeight;nav.style.transform=""}}
function reseatSoon(){reseat();requestAnimationFrame(reseat);for(const t of [150,400,800])setTimeout(reseat,t)}
async function shareSheet(data){try{return await navigator.share(data)}finally{reseatSoon()}}
if(window.visualViewport)visualViewport.addEventListener("resize",()=>{if(visualViewport.height>=window.innerHeight-1)reseatSoon()});
window.addEventListener("focus",reseatSoon);window.addEventListener("pageshow",reseatSoon);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)reseatSoon()});
document.addEventListener("focusout",e=>{if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))setTimeout(reseatSoon,50)});
// No pinch-zooming the page (iOS ignores the viewport tag for this, so stop its gesture events too).
for(const ev of ["gesturestart","gesturechange","gestureend"])document.addEventListener(ev,e=>{if(!e.target.closest||!e.target.closest(".viewer"))e.preventDefault()},{passive:false});
document.addEventListener("touchmove",e=>{if(e.touches.length>1&&!e.target.closest(".viewer"))e.preventDefault()},{passive:false});
// Photos open full screen, where you can pinch, drag and double-tap to zoom.
function openViewer(src,alt){
  const v=document.createElement("div");v.className="viewer";v.setAttribute("role","dialog");v.setAttribute("aria-label",alt||"Photo");
  v.innerHTML=`<img alt="${esc(alt||"")}" src="${esc(src)}"><button class="vx" type="button" aria-label="Close">×</button>`;document.body.appendChild(v);
  const im=v.querySelector("img");let sc=1,tx=0,ty=0,start=null,lastTap=0,moved=false;
  const base=()=>{const r=im.getBoundingClientRect();return{x:r.left-tx,y:r.top-ty}};
  const apply=()=>{im.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`};
  const clamp=()=>{if(sc<=1){sc=1;tx=0;ty=0}apply()};
  const close=()=>{v.remove();document.removeEventListener("keydown",key)};const key=e=>{if(e.key==="Escape")close()};document.addEventListener("keydown",key);
  v.querySelector(".vx").onclick=close;
  const pts=e=>[...e.touches].map(t=>({x:t.clientX,y:t.clientY}));
  v.addEventListener("touchstart",e=>{const p=pts(e);moved=false;start={p,sc,tx,ty,b:base()}},{passive:true});
  v.addEventListener("touchmove",e=>{e.preventDefault();if(!start)return;const p=pts(e);moved=true;
    if(p.length>=2&&start.p.length>=2){const d0=Math.hypot(start.p[0].x-start.p[1].x,start.p[0].y-start.p[1].y),d1=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
      const m0={x:(start.p[0].x+start.p[1].x)/2,y:(start.p[0].y+start.p[1].y)/2},m1={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};
      const ns=Math.max(1,Math.min(5,start.sc*d1/d0));const ox=(m0.x-start.b.x-start.tx)/start.sc,oy=(m0.y-start.b.y-start.ty)/start.sc;
      sc=ns;tx=m1.x-start.b.x-ox*ns;ty=m1.y-start.b.y-oy*ns;apply()}
    else if(p.length===1&&start.p.length===1&&sc>1){tx=start.tx+p[0].x-start.p[0].x;ty=start.ty+p[0].y-start.p[0].y;apply()}},{passive:false});
  v.addEventListener("touchend",e=>{if(e.touches.length){start={p:pts(e),sc,tx,ty,b:base()};return}start=null;clamp();
    if(!moved){const now=Date.now();if(now-lastTap<300){const t=e.changedTouches[0];if(sc>1){sc=1;tx=0;ty=0}else{const b=base();const ox=t.clientX-b.x,oy=t.clientY-b.y;sc=2.5;tx=-ox*1.5;ty=-oy*1.5}apply();lastTap=0}else lastTap=now}});
  v.addEventListener("click",e=>{if(e.target===v&&sc===1)close()});
}
document.addEventListener("click",e=>{const im=e.target.closest(".photo-edit img.photo, .veh-gallery img");if(im&&im.src&&!e.target.closest("button")){e.preventDefault();openViewer(im.src,im.alt)}});
// Pull to refresh. Home Screen apps don't get the browser's own, so we draw one: pull down at the top,
// let go past the line, and the app saves and syncs, then reloads with the newest version and data.
(()=>{const standalone=navigator.standalone||matchMedia("(display-mode: standalone)").matches;if(!standalone||!("ontouchstart" in window))return;
  document.documentElement.style.overscrollBehaviorY="contain";
  const el=document.createElement("div");el.className="ptr";el.setAttribute("aria-hidden","true");el.innerHTML=document.querySelector("nav.tabs a.rec-tab .ring svg").outerHTML;document.body.appendChild(el);
  const MAX=110,GO=70;let y0=null,dy=0,busy=false;
  const blocked=()=>busy||!$("#sheet").hidden||REC.on||window.scrollY>0;
  addEventListener("touchstart",e=>{if(blocked()||e.touches.length!==1){y0=null;return}y0=e.touches[0].clientY;dy=0},{passive:true});
  addEventListener("touchmove",e=>{if(y0==null)return;dy=Math.max(0,Math.min(MAX,(e.touches[0].clientY-y0)*.5));if(window.scrollY>0){dy=0}
    el.style.transform=`translate(-50%,${dy-50}px) rotate(${dy*4}deg)`;el.style.opacity=Math.min(1,dy/GO);el.classList.toggle("ready",dy>=GO)},{passive:true});
  addEventListener("touchend",async()=>{if(y0==null)return;y0=null;if(dy<GO){el.style.transition="transform .2s,opacity .2s";el.style.transform="translate(-50%,-50px)";el.style.opacity=0;setTimeout(()=>el.style.transition="",220);return}
    busy=true;el.classList.add("spin");el.style.transform=`translate(-50%,${GO-50}px)`;
    try{await Promise.race([Sync.run(),new Promise(r=>setTimeout(r,4000))])}catch(e){}location.reload()});
})();
if(authHash&&/error_description=/.test(authHash))toast("That sign-in link has expired. Request a new one.");
if(authHash&&/access_token=/.test(authHash))Sync.fromLink(authHash).then(()=>Social.refresh()).then(()=>rerender());else Sync.run().then(()=>Social.refresh());try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
</script>
